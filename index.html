<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>Lucky · Administra tu negocio de préstamos</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#16211b;--mute:#66736b;--line:#dfe5e1;--brand:#14532d;--brand2:#1d7a45;--bad:#b42318;--ok:#067647}
@media (prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#18211c;--ink:#e8efe9;--mute:#98a79d;--line:#2a372f;--brand:#4ade80;--brand2:#86efac;--bad:#f87171;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
@media (prefers-color-scheme:dark){header{background:#14532d}}
header b{font-size:18px}
header small{opacity:.85;display:block;font-size:12px}
main{padding:16px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=checkbox]{width:auto;margin-right:8px;transform:scale(1.2)}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--brand);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#052e16}}
button.sec{background:transparent;color:var(--brand);border:1px solid var(--line)}
button.bad{background:var(--bad);color:#fff}
button.sm{padding:6px 10px;font-size:13px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.row>*{flex:0 1 auto}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.mute{color:var(--mute);font-size:13px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute);margin-left:6px}
.off{opacity:.5}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:14px 2px;font-size:12px}
nav button.on{color:var(--brand);font-weight:600}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
.msg.err{background:#fee4e2;color:#7a271a}
.msg.ok{background:#d1fadf;color:#05603a}
.matrix{width:100%;border-collapse:collapse;font-size:14px}
.matrix th,.matrix td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat span{display:block;font-size:12px;color:var(--mute)}
.stat b{font-size:19px}
.tabla{font-size:12px}
.tabla th,.tabla td{text-align:right;vertical-align:top;padding:8px 3px}
.tabla td:not(:first-child){white-space:nowrap}
.tabla th:first-child,.tabla td:first-child{text-align:left;white-space:normal;min-width:78px;padding-left:10px}
.tabla th:last-child,.tabla td:last-child{padding-right:10px}
.tabla th{font-size:11.5px;color:var(--mute);font-weight:600}
.tabla .tag{margin:4px 0 0;font-size:11px;padding:2px 6px;white-space:nowrap}
.tabla tbody tr:active{background:var(--bg)}
.tabla tfoot td{font-weight:700;border-bottom:0}
nav{overflow-x:auto}
nav button{flex:1 0 auto;white-space:nowrap;padding-left:10px;padding-right:10px}
.viz{--v-cap:#2a78d6;--v-gan:#1baf7a;--v-r1:#6da7ec;--v-r2:#3987e5;--v-r3:#256abf;--v-r4:#184f95;--v-grid:#e1e0d9;--v-base:#c3c2b7;--v-eje:#898781;position:relative}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .viz{--v-cap:#3987e5;--v-gan:#199e70;--v-grid:#2c2c2a;--v-base:#383835}}
:root[data-theme="dark"] .viz{--v-cap:#3987e5;--v-gan:#199e70;--v-grid:#2c2c2a;--v-base:#383835}
.hero-et{font-size:13px;color:var(--mute)}
.hero{font-size:48px;font-weight:700;line-height:1.1;letter-spacing:-.5px;margin:2px 0 4px;word-break:break-word}
.sub{font-size:12.5px;margin:2px 0 8px}
.card h3{font-size:14px;margin:14px 0 2px}
.v-split{display:flex;gap:2px;height:14px}
.v-split>div{border-radius:4px;min-width:0}
.v-dos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.v-dos>div{display:flex;flex-direction:column;gap:1px;font-size:13px;color:var(--mute)}
.v-dos i,.v-ley i,.v-tr i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-bottom:2px}
.v-dos b{font-size:18px;color:var(--ink)}
.v-dos small,.stat small{font-size:11.5px;display:block;margin-top:2px}
.stat.alerta{border-color:var(--bad)}
.ok-t{color:var(--ok)}
.v-ley{display:flex;gap:14px;font-size:12.5px;color:var(--mute);margin:4px 0}
.v-ley span{display:inline-flex;align-items:center;gap:6px}
.v-ley i{height:10px;width:10px;border-radius:2px;margin:0}
.v-svg{width:100%;height:auto;display:block;touch-action:pan-y}
.v-grid{stroke:var(--v-grid);stroke-width:1}
.v-base{stroke:var(--v-base);stroke-width:1}
.v-eje{fill:var(--v-eje);font-size:10px}
.v-hit{fill:transparent;cursor:pointer;outline:none}
.v-hit:focus-visible{stroke:var(--ink);stroke-width:1;stroke-opacity:.4}
.v-barra.on{filter:brightness(1.12)}
.v-tip{position:absolute;z-index:6;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px #0002;pointer-events:none;white-space:nowrap}
.v-tt{font-weight:600;margin-bottom:4px}
.v-tr{display:flex;align-items:center;gap:6px;color:var(--mute)}
.v-tr b{color:var(--ink);font-size:14px}
.v-fila{display:grid;grid-template-columns:86px 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.v-pista{height:14px}
.v-rel{height:14px;border-radius:0 4px 4px 0}
.v-val{text-align:right;font-weight:600}
.v-val small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.refresco{opacity:.55}
[hidden]{display:none!important}
.cols2{display:grid;gap:0 12px;align-items:start}
.charts{display:grid;gap:0 28px}
@media (min-width:700px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .charts{grid-template-columns:1fr 1fr}
}
@media (min-width:900px){
  body{padding-bottom:0}
  #app{display:flex;flex-direction:column;min-height:100vh}
  header{position:static;padding:14px 32px}
  nav{order:1;position:sticky;top:0;bottom:auto;z-index:4;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:6px;overflow:visible}
  nav button{flex:0 0 auto;padding:14px 20px;font-size:14px}
  nav button.on{box-shadow:inset 0 -3px 0 var(--brand)}
  main{order:2;width:100%;max-width:1160px;padding:24px 32px}
  main.t-personas,main.t-roles,main.t-usuarios,main.t-config,main.t-cuenta{max-width:820px}
  .cols2{grid-template-columns:1fr 1fr}
  .tabla{font-size:14px}
  .tabla th{font-size:13px}
  .tabla th:first-child,.tabla td:first-child{min-width:140px}
  .hero{font-size:56px}
}
@media (min-width:1100px){
  .stats{grid-template-columns:repeat(4,1fr)}
  .charts{grid-template-columns:repeat(3,1fr)}
}
.hd-btns{display:flex;gap:8px;align-items:center}
.badge{background:var(--bad);color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;font-weight:700;margin-left:3px}
.acciones{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
a.btn{display:inline-block;text-decoration:none;background:var(--brand);color:#fff;border-radius:10px;padding:12px 16px;font:inherit;text-align:center}
@media (prefers-color-scheme:dark){a.btn{color:#052e16}}
a.btn.sm{padding:6px 10px;font-size:13px}
a.btn.sec{background:transparent;color:var(--brand);border:1px solid var(--line)}
.prob{margin:6px 0 0;padding-left:20px;font-size:13px;color:var(--ink)}
details summary{cursor:pointer}
input[type=file]{padding:10px}
.hd-btns button{white-space:nowrap}
.bad-t{color:var(--bad)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
details summary{cursor:pointer;font-size:17px;padding:2px 0}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script>
// ======== CONFIGURACIÓN (pegar los datos del proyecto Supabase de esta instalación) ========
const SUPABASE_URL = 'https://xyjzsxrordwztizhuizm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5anpzeHJvcmR3enRpemh1aXptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MTAzMjksImV4cCI6MjEwNzM4NjMyOX0.e9mG5xKU2wQrfgfJp8_xoFR4ZJmkwcznAnGaSuv7a5w';
// Nombre de la plataforma (lo que ve cualquiera antes de entrar). Cámbialo aquí cuando elijas el nombre definitivo.
const NOMBRE_PLATAFORMA = 'Lucky';
const NOMBRE_NEGOCIO = 'Mi negocio'; // solo mientras carga; el nombre real viene de cada negocio
const MAX_INTENTOS = 5, MIN_BLOQUEO = 15; // deben coincidir con 04_acceso.sql
// ============================================================================================

const MODULOS = [['personas','Personas'],['prestamos','Préstamos'],['fiados','Fiados'],['pagos','Pagos'],['caja','Caja'],['reportes','Estadísticas']];
const ACCIONES = ['ver','crear','editar','anular','exportar'];
const limpiarUsuario = s => String(s || '').trim().toLowerCase().replace(/\s+/g, '');
// La cuenta se escribe usuario@código-del-negocio (ej: maria@inversionesvitola)
const partirCuenta = s => { const t = limpiarUsuario(s), i = t.lastIndexOf('@'); return i < 1 ? null : { usuario: t.slice(0, i), codigo: t.slice(i + 1) }; };
const tasaDe = tipo => { const v = tipo === 'fiado' ? negocio.tasa_credito : negocio.tasa_prestamo; return v == null || v === '' ? (tipo === 'fiado' ? 10 : 20) : v; };
const cuentaDe = u => (u && u.usuario ? u.usuario + '@' + (negocio.codigo || '') : '');

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let me = null, perms = new Set(), tab = 'prestamos', aviso = null, rolSel = null, negocio = { nombre: NOMBRE_NEGOCIO };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const can = (m, a) => !!me && (me.es_admin || perms.has(m + ':' + a));
const setAviso = (t, tipo = 'err') => { aviso = t ? { t, tipo } : null; };
const avisoHtml = () => aviso ? `<div class="msg ${aviso.tipo}">${esc(aviso.t)}</div>` : '';

async function init() {
  if (SUPABASE_URL.startsWith('PEGA')) {
    $('#app').innerHTML = '<main><div class="card"><h2>Falta configurar</h2><p class="mute">Edita el archivo y pega la URL y la clave publishable de tu proyecto Supabase al inicio del script.</p></div></main>';
    return;
  }
  const { data } = await sb.auth.getSession();
  if (data.session) await cargarYo(); else vistaLogin();
}

async function cargarYo() {
  const { data: u } = await sb.auth.getUser();
  if (!u.user) return vistaLogin();
  const { data: p, error } = await sb.from('perfiles').select('*').eq('id', u.user.id).single();
  if (error || !p) { await sb.auth.signOut(); setAviso('No se encontró tu perfil.'); return vistaLogin(); }
  me = p; perms = new Set();
  alertasCache = null; negocio = { nombre: NOMBRE_NEGOCIO };
  if (!p.es_plataforma) {
    const { data: nx } = await sb.from('negocios').select('*').maybeSingle();
    if (!nx || nx.estado !== 'activo') { await sb.auth.signOut(); me = null; setAviso('Este negocio está suspendido o no está disponible. Comunícate con el soporte de la plataforma.'); return vistaLogin(); }
    negocio = { ...(nx.config || {}), nombre: nx.nombre, codigo: nx.codigo };
  }
  if (!p.es_admin && p.role_id) {
    const { data: pm } = await sb.from('permisos').select('modulo,accion').eq('role_id', p.role_id);
    (pm || []).forEach(x => perms.add(x.modulo + ':' + x.accion));
  }
  if (!p.activo || (!p.es_admin && !p.es_plataforma && !p.role_id)) {
    await sb.auth.signOut(); me = null;
    setAviso('Tu cuenta todavía no tiene acceso. Pídele al administrador que la habilite.');
    return vistaLogin();
  }
  if (!tabsVisibles().includes(tab)) tab = tabsVisibles()[0] || 'personas';
  if (p.es_plataforma && tab === 'personas') tab = 'negocios';
  render();
}

function vistaLogin() {
  $('#app').innerHTML = `<div class="login">
    <h1 style="text-align:center;color:var(--brand);margin-bottom:4px">${esc(NOMBRE_PLATAFORMA)}</h1>
    <p class="mute" style="text-align:center;margin:0 0 14px">Administra tu negocio de préstamos</p>
    <form class="card" id="l-form" autocomplete="on">
      <h2>Iniciar sesión</h2>
      ${avisoHtml()}
      <label>Tu cuenta</label><input id="l-mail" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email" placeholder="usuario@negocio">
      <p class="mute" style="font-size:12px;margin:4px 0 0">Es el usuario y el código de tu negocio, separados por @. Si no lo sabes, pídeselo a tu administrador.</p>
      <label>Clave</label><input id="l-pass" type="password" autocomplete="current-password">
      <div style="margin-top:14px"><button style="width:100%" id="l-go" type="submit">Entrar</button></div>
      <p class="mute" style="font-size:12px;margin:12px 0 0;text-align:center">Después de ${MAX_INTENTOS} intentos fallidos el usuario se bloquea ${MIN_BLOQUEO} minutos.</p>
    </form></div>`;
  $('#l-form').onsubmit = async ev => {
    ev.preventDefault();
    const usuario = limpiarUsuario($('#l-mail').value), password = $('#l-pass').value;
    if (!usuario || !password) { setAviso('Escribe el usuario y la clave.'); return vistaLogin(); }
    const cta = partirCuenta(usuario);
    if (!cta) { setAviso('Escribe tu cuenta completa, con el código de tu negocio. Ejemplo: maria@minegocio'); return vistaLogin(); }
    $('#l-go').disabled = true;
    setAviso(null);
    // La clave se verifica en el servidor, que cuenta los intentos fallidos y bloquea al llegar al límite
    const { data: r, error: e0 } = await sb.rpc('verificar_acceso', { p_usuario: cta.usuario, p_codigo: cta.codigo, p_clave: password });
    if (e0) { setAviso('No se pudo verificar el acceso: ' + e0.message); return vistaLogin(); }
    if (r && r.estado === 'bloqueado') { setAviso(`Demasiados intentos fallidos. Este usuario está bloqueado, intenta de nuevo en ${Math.ceil((r.segundos || 60) / 60)} minuto(s).`); return vistaLogin(); }
    if (!r || r.estado !== 'ok') { setAviso('Usuario o clave incorrectos.'); return vistaLogin(); }
    const { error } = await sb.auth.signInWithPassword({ email: r.email, password });
    if (error) { setAviso('Usuario o clave incorrectos.'); return vistaLogin(); }
    await cargarYo();
  };
}

function tabsVisibles() {
  if (me && me.es_plataforma) return ['negocios'];
  const t = [];
  if (can('prestamos', 'ver')) t.push('prestamos');
  if (can('prestamos', 'ver')) t.push('alertas');
  if (can('reportes', 'ver')) t.push('estadisticas');
  if (can('personas', 'ver')) t.push('personas');
  if (can('personas', 'crear') || can('prestamos', 'crear')) t.push('importar');
  if (me && me.es_admin) t.push('roles', 'usuarios', 'config');
  return t;
}
const TAB_NOMBRE = { prestamos: 'Préstamos', personas: 'Personas', alertas: 'Alertas', estadisticas: 'Estadísticas', importar: 'Importar', roles: 'Roles', usuarios: 'Usuarios', config: 'Ajustes', cuenta: 'Mi clave', negocios: 'Negocios' };

function render() {
  const t = tabsVisibles();
  $('#app').innerHTML = `
    <header><div><b>${esc(me.es_plataforma ? NOMBRE_PLATAFORMA : negocio.nombre)}</b><small>${esc(me.nombre)}${me.es_plataforma ? ' · Dueño de la plataforma' : me.es_admin ? ' · Administrador' : ''}</small></div><div class="hd-btns"><button class="sec sm" style="color:#fff;border-color:#ffffff55" id="clave">Mi clave</button><button class="sec sm" style="color:#fff;border-color:#ffffff55" id="salir">Salir</button></div></header>
    <main id="vista" class="t-${tab}"></main>
    <nav>${t.map(x => `<button data-t="${x}" class="${x === tab ? 'on' : ''}">${TAB_NOMBRE[x]}</button>`).join('')}</nav>`;
  $('#salir').onclick = async () => { await sb.auth.signOut(); me = null; cuentaSel = null; setAviso(null); vistaLogin(); };
  $('#clave').onclick = () => { tab = 'cuenta'; setAviso(null); render(); };
  badgeAlertas();
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; cuentaSel = null; setAviso(null); render(); });
  if (!t.length && tab !== 'cuenta') { $('#vista').innerHTML = '<div class="card">Tu rol aún no tiene permisos asignados.</div>'; return; }
  ({ prestamos: vPrestamos, alertas: vAlertas, estadisticas: vEstadisticas, importar: vImportar, personas: vPersonas, roles: vRoles, usuarios: vUsuarios, config: vConfig, cuenta: vMiClave, negocios: vNegocios })[tab]();
}

/* ---------------- PERSONAS ---------------- */
async function vPersonas(filtro = '') {
  const v = $('#vista');
  v.innerHTML = '<p class="mute">Cargando…</p>';
  const { data, error } = await sb.from('personas').select('*').order('creado_en', { ascending: false }).limit(300);
  if (error) { v.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  const f = filtro.toLowerCase();
  const lista = (data || []).filter(p => !f || (p.nombre + p.cedula + p.telefono).toLowerCase().includes(f));
  v.innerHTML = `${avisoHtml()}
    ${can('personas', 'crear') ? `<div class="card"><h2>Registrar persona</h2>
      <label>Cédula *</label><input id="p-ced" inputmode="numeric">
      <label>Nombre completo *</label><input id="p-nom">
      <label>Teléfono / WhatsApp *</label><input id="p-tel" inputmode="tel">
      <label>Tipo</label><select id="p-tipo"><option value="cliente">Cliente</option><option value="fiador">Fiador / codeudor</option><option value="referencia">Referencia</option></select>
      <label>Dirección</label><input id="p-dir">
      <label>Barrio o zona de cobro</label><input id="p-bar">
      <label>Notas</label><textarea id="p-not" rows="2"></textarea>
      <label style="display:flex;align-items:center;color:var(--ink)"><input type="checkbox" id="p-con">Autoriza el tratamiento de sus datos personales</label>
      <div style="margin-top:12px"><button id="p-save">Guardar</button></div></div>` : ''}
    <div class="card"><input id="p-q" placeholder="Buscar por nombre, cédula o teléfono" value="${esc(filtro)}">
      <div style="margin-top:8px">${lista.length ? lista.map(p => `
        <div class="item ${p.activo ? '' : 'off'}">
          <div class="row"><div><b>${esc(p.nombre)}</b><span class="tag">${esc(p.tipo)}</span>${p.activo ? '' : '<span class="tag">anulada</span>'}</div>
          ${p.activo && can('personas', 'anular') ? `<button class="sec sm" data-anular="${p.id}">Anular</button>` : ''}</div>
          <div class="mute">CC ${esc(p.cedula)} · ${esc(p.telefono)}${p.barrio ? ' · ' + esc(p.barrio) : ''}</div>
          ${p.direccion ? `<div class="mute">${esc(p.direccion)}</div>` : ''}
          ${p.activo ? '' : `<div class="mute">Motivo: ${esc(p.motivo_anulacion)}</div>`}
        </div>`).join('') : '<p class="mute">Sin resultados.</p>'}</div></div>`;
  $('#p-q').oninput = e => { clearTimeout(window._t); window._t = setTimeout(() => vPersonas(e.target.value), 300); };
  if ($('#p-save')) $('#p-save').onclick = async () => {
    const r = { cedula: $('#p-ced').value.trim(), nombre: $('#p-nom').value.trim(), telefono: $('#p-tel').value.trim(),

/* ======================= PRÉSTAMOS ======================= */
const hoy = () => new Date().toLocaleDateString('en-CA');
const money = n => '$' + Math.round(Number(n || 0)).toLocaleString('es-CO');
const fdate = s => s ? String(s).slice(0, 10).split('-').reverse().join('/') : '';
const diasEntre = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const entero = s => Number(String(s ?? '').replace(/\D/g, '')) || 0;
const decimal = s => Number(String(s ?? '').replace(',', '.'));
const pad = n => String(n).padStart(5, '0');
const nom = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '_').replace(/^_+|_+$/g, '');
const FREQ = { semanal: 'Semanal', quincenal: 'Quincenal', mensual: 'Mensual' };
const PERIODOS_MES = { semanal: 4, quincenal: 2, mensual: 1 };
let cuentaSel = null, filtroPres = 'todos', vistaPres = 'tabla';

function calcCuenta(c) {
  const cu = (c.cuotas || []).slice().sort((a, b) => a.numero - b.numero);
  const pagado = cu.reduce((s, q) => s + Number(q.pagado), 0);
  const saldo = c.estado === 'anulado' ? 0 : Math.max(0, Number(c.total) - Number(c.descuento || 0) - pagado);
  const h = hoy();
  const sinPagar = q => Number(q.pagado) < Number(q.valor);
  const atrasadas = c.estado === 'vigente' ? cu.filter(q => q.fecha_vencimiento < h && sinPagar(q)) : [];
  const vencido = Math.min(saldo, atrasadas.reduce((s, q) => s + Number(q.valor) - Number(q.pagado), 0));
  const proxima = c.estado === 'vigente' ? cu.find(sinPagar) || null : null;
  return { cu, pagado, saldo, atrasadas, vencido, proxima, mora: atrasadas.length > 0,
    diasMora: atrasadas.length ? diasEntre(atrasadas[0].fecha_vencimiento, h) : 0 };
}
const estadoCuenta = (c, k) => c.estado === 'anulado' ? ['Anulado', ''] : c.estado === 'pagado' ? ['Paz y salvo', 'ok'] : k.mora ? ['En mora', 'bad'] : ['Al día', 'ok'];
// Lo que el cliente debe pagar ahora: lo vencido si está en mora, o la próxima cuota.
function cuotaAPagar(k, c) {
  if (c.estado !== 'vigente') return null;
  if (k.mora) return { valor: k.vencido, fecha: k.atrasadas[0].fecha_vencimiento, vencida: true };
  if (k.proxima) return { valor: Math.min(k.saldo, Number(k.proxima.valor) - Number(k.proxima.pagado)), fecha: k.proxima.fecha_vencimiento, vencida: false };
  return null;
}
const NOMBRES_FILTRO = { todos: 'Todos', vigentes: 'Vigentes', mora: 'En mora', pagados: 'Paz y salvo', anulados: 'Anulados' };

function tablaPrestamos(lista) {
  const filas = lista.map(c => ({ c, a: cuotaAPagar(c.k, c) }));
  const totPag = lista.reduce((s, c) => s + c.k.pagado, 0), totSal = lista.reduce((s, c) => s + c.k.saldo, 0), totCuo = filas.reduce((s, f) => s + (f.a ? f.a.valor : 0), 0);
  return `<div style="overflow-x:auto;margin:0 -14px"><table class="matrix tabla"><thead><tr><th>Cliente</th><th>Pagado</th><th>Saldo</th><th>Cuota a pagar</th></tr></thead><tbody>
    ${filas.map(({ c, a }) => `<tr data-c="${c.id}" style="cursor:pointer"><td><b>${esc(c.personas?.nombre || '—')}</b><div class="mute" style="font-size:11px">#${pad(c.consecutivo)}${c.tipo === 'fiado' ? ' · Producto' + (c.descripcion ? ': ' + esc(c.descripcion) : '') : ''}</div>${tagHtml(estadoCuenta(c, c.k))}</td><td>${money(c.k.pagado)}</td><td><b>${money(c.k.saldo)}</b></td><td>${a ? `<b class="${a.vencida ? 'bad-t' : ''}">${money(a.valor)}</b><br><span class="mute">${a.vencida ? 'desde ' : 'vence '}${fdate(a.fecha).slice(0, 5)}</span>` : '—'}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>Total (${lista.length})</td><td>${money(totPag)}</td><td>${money(totSal)}</td><td>${money(totCuo)}</td></tr></tfoot></table></div>`;
}
function tarjetasPrestamos(lista) {
  return lista.map(c => `
    <div class="item" data-c="${c.id}" style="cursor:pointer">
      <div class="row"><div><b>#${pad(c.consecutivo)} · ${esc(c.personas?.nombre || '—')}</b> ${tagHtml(estadoCuenta(c, c.k))}${c.tipo === 'fiado' ? `<div class="mute" style="font-size:12px">Producto a crédito${c.descripcion ? ': ' + esc(c.descripcion) : ''}</div>` : ''}</div><b>${money(c.k.saldo)}</b></div>
      <div class="mute">${c.estado === 'vigente'
        ? (c.k.mora ? `${c.k.atrasadas.length} cuota(s) vencida(s) · ${c.k.diasMora} días de atraso · debe ${money(c.k.vencido)}`
          : c.k.proxima ? `Próxima cuota: ${fdate(c.k.proxima.fecha_vencimiento)} · ${money(Number(c.k.proxima.valor) - Number(c.k.proxima.pagado))}` : '')
        : `Capital ${money(c.capital)} · ${c.num_cuotas} cuotas`}</div>
    </div>`).join('');
}
const tagHtml = ([t, cls]) => `<span class="tag ${cls}">${t}</span>`;

async function vPrestamos() {
  if (cuentaSel) return vCuenta();
  const v = $('#vista');
  v.innerHTML = '<p class="mute">Cargando…</p>';
  const [rc, rp] = await Promise.all([
    sb.from('cuentas').select('*,personas(nombre,cedula,telefono),cuotas(numero,fecha_vencimiento,valor,pagado)').order('creado_en', { ascending: false }).limit(500),
    (can('prestamos', 'crear') || can('fiados', 'crear')) ? sb.from('personas').select('id,nombre,cedula').eq('activo', true).eq('tipo', 'cliente').order('nombre') : Promise.resolve({ data: [] })
  ]);
  if (rc.error) { v.innerHTML = `<div class="msg err">${esc(rc.error.message)}</div>`; return; }
  const clientes = rp.data || [];
  const cuentas = rc.data.map(c => ({ ...c, k: calcCuenta(c) }));
  const vig = cuentas.filter(c => c.estado === 'vigente');
  const h = hoy();
  const cartera = vig.reduce((s, c) => s + c.k.saldo, 0);
  const vencido = vig.reduce((s, c) => s + c.k.vencido, 0);
  const cobroHoy = vig.reduce((s, c) => s + c.k.cu.filter(q => q.fecha_vencimiento === h).reduce((t, q) => t + Math.max(0, Number(q.valor) - Number(q.pagado)), 0), 0);
  let lista = cuentas.filter(c => ({
    todos: c.estado !== 'anulado', vigentes: c.estado === 'vigente', mora: c.k.mora,
    pagados: c.estado === 'pagado', anulados: c.estado === 'anulado' })[filtroPres]);
  if (filtroPres === 'mora') lista.sort((a, b) => b.k.diasMora - a.k.diasMora);

  v.innerHTML = `${avisoHtml()}
    <div class="stats">
      <div class="stat"><span>Cartera por cobrar</span><b>${money(cartera)}</b></div>
      <div class="stat"><span>Vencido</span><b class="${vencido ? 'bad-t' : ''}">${money(vencido)}</b></div>
      <div class="stat"><span>Para cobrar hoy</span><b>${money(cobroHoy)}</b></div>
      <div class="stat"><span>Préstamos vigentes</span><b>${vig.length}</b></div>
    </div>
    ${(can('prestamos', 'crear') || can('fiados', 'crear')) ? `<details class="card"><summary><b>Nuevo préstamo o crédito</b></summary>
      ${clientes.length ? '' : '<p class="mute">Primero registra al cliente en la pestaña Personas.</p>'}
      <label>¿Qué vas a registrar?</label><select id="n-tipo">${can('prestamos', 'crear') ? '<option value="prestamo">Préstamo de dinero</option>' : ''}${can('fiados', 'crear') ? '<option value="fiado">Producto a crédito</option>' : ''}</select>
      <label>Cliente</label><select id="n-per"><option value="">Selecciona…</option>${clientes.map(p => `<option value="${p.id}">${esc(p.nombre)} · ${esc(p.cedula)}</option>`).join('')}</select>
      <div id="n-desc-w" hidden><label>Producto que se entrega</label><input id="n-desc" maxlength="200" placeholder="Ej: nevera, celular, mercancía"></div>
      <label id="n-cap-l">Capital prestado ($)</label><input id="n-cap" inputmode="numeric" placeholder="1000000">
      <label>Interés mensual (%)</label><input id="n-tasa" inputmode="decimal" value="${tasaDe(can('prestamos', 'crear') ? 'prestamo' : 'fiado')}">
      <p class="mute" style="font-size:12px;margin:4px 0 0">Ya viene con tu tasa habitual, pero puedes cambiarla en cada operación.</p>
      <label>Frecuencia de pago</label><select id="n-fre"><option value="mensual">Mensual</option><option value="quincenal">Quincenal</option><option value="semanal">Semanal</option></select>
      <label>Número de cuotas</label><input id="n-cuo" inputmode="numeric" value="3">
      <label>Fecha de desembolso</label><input id="n-fec" type="date" value="${h}">
      <div class="msg ok" id="n-prev"></div>
      <div id="n-msg"></div>
      <button id="n-go">Crear préstamo</button></details>` : ''}
    <div class="card">
      <div class="row"><select id="f-pres" style="flex:1">${Object.entries(NOMBRES_FILTRO).map(([val, t]) => `<option value="${val}" ${val === filtroPres ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <select id="v-pres" style="flex:0 0 112px"><option value="tabla" ${vistaPres === 'tabla' ? 'selected' : ''}>Tabla</option><option value="tarjetas" ${vistaPres === 'tarjetas' ? 'selected' : ''}>Tarjetas</option></select></div>
      ${can('prestamos', 'exportar') && lista.length ? '<p style="margin:10px 0 0"><button class="sec sm" id="b-rep">Descargar estado de cartera (PDF)</button></p>' : ''}
      <div style="margin-top:8px">${lista.length ? (vistaPres === 'tabla' ? tablaPrestamos(lista) : tarjetasPrestamos(lista)) : '<p class="mute">No hay préstamos en esta vista.</p>'}</div></div>`;

  $('#f-pres').onchange = e => { filtroPres = e.target.value; vPrestamos(); };
  $('#v-pres').onchange = e => { vistaPres = e.target.value; vPrestamos(); };
  if ($('#b-rep')) $('#b-rep').onclick = () => generar(() => docCartera(lista, NOMBRES_FILTRO[filtroPres]));
  document.querySelectorAll('[data-c]').forEach(el => el.onclick = () => { cuentaSel = el.dataset.c; setAviso(null); vPrestamos(); });

  if ($('#n-go')) {
    const prev = () => {
      const cap = entero($('#n-cap').value), tasa = decimal($('#n-tasa').value), fre = $('#n-fre').value, n = entero($('#n-cuo').value);

    $('#n-tipo').onchange = () => alTipo(true);

    $('#n-go').onclick = async () => {
      const per = $('#n-per').value, cap = entero($('#n-cap').value), tasa = decimal($('#n-tasa').value), fre = $('#n-fre').value, cuo = entero($('#n-cuo').value), fec = $('#n-fec').value;

/* ======================= DOCUMENTOS (PDF) ======================= */
function generar(fn) {
  try {
    if (!window.jspdf) throw new Error('No se cargó el generador de PDF. Revisa tu conexión a internet.');
    fn();
  } catch (e) { alert('No se pudo generar el documento: ' + e.message); }
}

function letras(n) {
  n = Math.floor(Math.abs(n));
  if (n === 0) return 'cero';
  if (n >= 1e9) return String(n);
  const U = ['', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés', 'veinticuatro', 'veinticinco', 'veintiséis', 'veintisiete', 'veintiocho', 'veintinueve'];
  const D = ['', '', '', 'treinta', 'cuarenta', 'cincuenta', 'sesenta', 'setenta', 'ochenta', 'noventa'];
  const C = ['', 'ciento', 'doscientos', 'trescientos', 'cuatrocientos', 'quinientos', 'seiscientos', 'setecientos', 'ochocientos', 'novecientos'];
  const apoc = s => s.replace(/veintiuno$/, 'veintiún').replace(/uno$/, 'un');
  const m1000 = x => {
    if (x === 100) return 'cien';
    const c = Math.floor(x / 100), r = x % 100;
    let s = c ? C[c] + (r ? ' ' : '') : '';
    if (r < 30) s += U[r]; else { const d = Math.floor(r / 10), u = r % 10; s += D[d] + (u ? ' y ' + U[u] : ''); }
    return s;
  };
  const mill = Math.floor(n / 1e6), mil = Math.floor((n % 1e6) / 1e3), resto = n % 1e3, out = [];
  if (mill) out.push(mill === 1 ? 'un millón' : apoc(m1000(mill)) + ' millones');
  if (mil) out.push(mil === 1 ? 'mil' : apoc(m1000(mil)) + ' mil');
  if (resto) out.push(m1000(resto));
  return out.join(' ');
}
const enLetras = n => { const t = letras(n); return t.charAt(0).toUpperCase() + t.slice(1) + (Math.floor(n) % 1e6 === 0 && n >= 1e6 ? ' de pesos' : ' pesos'); };

function nuevoDoc(titulo) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'letter' });
  doc.setTextColor(0);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text(negocio.nombre || '', 108, 18, { align: 'center' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
  const lin = [negocio.nit ? 'NIT / CC ' + negocio.nit : '', [negocio.direccion, negocio.ciudad].filter(Boolean).join(' - '), negocio.telefono ? 'Tel. ' + negocio.telefono : ''].filter(Boolean);
  lin.forEach((t, i) => doc.text(t, 108, 24 + i * 4.5, { align: 'center' }));
  const y = 24 + lin.length * 4.5 + 3;
  doc.setDrawColor(20, 83, 45); doc.setLineWidth(0.6); doc.line(15, y, 201, y);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
  doc.text(titulo, 108, y + 9, { align: 'center' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  return { doc, y: y + 18 };
}
const kv = (doc, y, pares) => {
  pares.forEach(([clave, val]) => {
    doc.setFont('helvetica', 'bold'); doc.text(clave + ':', 15, y);
    doc.setFont('helvetica', 'normal');
    const l = doc.splitTextToSize(String(val), 135); doc.text(l, 62, y); y += 5.8 * l.length;
  });
  return y + 2;
};
const parrafo = (doc, y, t) => { const l = doc.splitTextToSize(t, 186); doc.text(l, 15, y); return y + 5.5 * l.length + 3; };
const negrita = (doc, y, t) => { doc.setFont('helvetica', 'bold'); doc.text(t, 15, y); doc.setFont('helvetica', 'normal'); return y + 6; };
const tablaEstilo = { styles: { fontSize: 9, halign: 'right' }, headStyles: { fillColor: [20, 83, 45], halign: 'right' }, footStyles: { fillColor: [230, 238, 233], textColor: 0 }, margin: { left: 15, right: 15 } };

function firmaYGuardar(doc, y, archivo) {
  if (y > 235) { doc.addPage(); y = 30; }
  y += 22;
  doc.setDrawColor(0); doc.setLineWidth(0.3); doc.line(15, y, 90, y);
  doc.setFontSize(10); doc.text(negocio.representante || 'Firma autorizada', 15, y + 5);
  doc.setFontSize(9); doc.text(negocio.nombre || '', 15, y + 10);
  guardarPie(doc, archivo);
}
function guardarPie(doc, archivo) {
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120);
    doc.text(`Documento generado el ${new Date().toLocaleString('es-CO')} · ${negocio.nombre || ''}`, 108, 272, { align: 'center' });
  }
  doc.save(archivo);
}

function docAmortizacion(c, k, per) {
  const { doc, y } = nuevoDoc('TABLA DE AMORTIZACIÓN');
  let yy = kv(doc, y, [
    ['Obligación No.', pad(c.consecutivo)], ['Cliente', per.nombre || ''], ['Cédula', per.cedula || ''],
    ['Desembolso', fdate(c.fecha_desembolso)], ['Capital', money(c.capital)],
    ['Interés', `${Number(c.tasa_mensual)}% mensual fijo sobre el capital inicial = ${money(c.interes_total)}`],
    ['Total a pagar', money(c.total)],
    ['Forma de pago', `${c.num_cuotas} cuotas ${FREQ[c.frecuencia].toLowerCase()}es`]]);
  let s = Number(c.total);
  const estQ = q => Number(q.pagado) >= Number(q.valor) ? 'Pagada' : c.estado === 'anulado' ? 'Anulada' : c.estado === 'pagado' ? 'Cubierta' : q.fecha_vencimiento < hoy() ? 'Vencida' : Number(q.pagado) > 0 ? 'Parcial' : (k.proxima && k.proxima.numero === q.numero ? 'A pagar' : 'Pendiente');
  const body = k.cu.map(q => { s -= Number(q.valor); return [q.numero, fdate(q.fecha_vencimiento), money(q.capital_parte), money(q.interes_parte), money(q.valor), money(Math.max(0, s)), money(q.pagado), estQ(q)]; });
  const sum = f => k.cu.reduce((t, q) => t + Number(q[f]), 0);
  doc.autoTable({ ...tablaEstilo, startY: yy,
    head: [['#', 'Vence', 'Capital', 'Interés', 'Cuota', 'Saldo', 'Pagado', 'Estado']], body,
    foot: [['', 'Total', money(sum('capital_parte')), money(sum('interes_parte')), money(sum('valor')), '', money(sum('pagado')), '']],
    columnStyles: { 0: { halign: 'center' }, 1: { halign: 'center' }, 7: { halign: 'center' } },
    didParseCell: d => {
      if (d.section !== 'body' || d.column.index !== 7) return;
      const t = d.cell.raw;
      if (t === 'Pagada' || t === 'Cubierta') d.cell.styles.textColor = [6, 118, 71];
      if (t === 'Vencida') d.cell.styles.textColor = [180, 35, 24];
      if (t === 'A pagar') d.cell.styles.fontStyle = 'bold';
    } });
  yy = doc.lastAutoTable.finalY + 8;
  if (Number(c.descuento) > 0) { doc.text('Descuento otorgado: ' + money(c.descuento), 15, yy); yy += 6; }
  yy = negrita(doc, yy, 'Saldo pendiente a la fecha: ' + money(k.saldo));
  const ap = cuotaAPagar(k, c);
  if (ap) yy = negrita(doc, yy, `${ap.vencida ? 'Cuota vencida a pagar' : 'Cuota a pagar'}: ${money(ap.valor)} (${ap.vencida ? 'vencida desde' : 'vence'} ${fdate(ap.fecha)})`);
  if (c.estado === 'pagado') yy = negrita(doc, yy, 'PAZ Y SALVO: obligación cancelada en su totalidad.');
  firmaYGuardar(doc, yy, `Amortizacion_${pad(c.consecutivo)}_${nom(per.nombre)}.pdf`);
}

function docRecibo(c, k, per, p) {
  if (!p) throw new Error('Pago no encontrado');
  const { doc, y } = nuevoDoc('RECIBO DE PAGO No. ' + pad(p.consecutivo));
  let yy = kv(doc, y, [['Fecha', fdate(p.fecha)], ['Obligación No.', pad(c.consecutivo)], ['Forma de pago', p.metodo]]);
  yy = parrafo(doc, yy + 2, `Recibí de ${per.nombre}, identificado(a) con cédula No. ${per.cedula}, la suma de ${enLetras(p.monto)} (${money(p.monto)}), por concepto de pago de la obligación No. ${pad(c.consecutivo)}.`);
  if (p.nota) yy = kv(doc, yy, [['Observación', p.nota]]);
  yy = negrita(doc, yy + 2, 'Saldo actual de la obligación: ' + money(k.saldo));
  firmaYGuardar(doc, yy, `Recibo_${pad(p.consecutivo)}_${nom(per.nombre)}.pdf`);
}

function docCobro(c, k, per) {
  const h = hoy(), venc = k.atrasadas, lista = venc.length ? venc : (k.proxima ? [k.proxima] : []);
  if (!lista.length) throw new Error('Este préstamo no tiene cuotas pendientes.');
  const { doc, y } = nuevoDoc(venc.length ? 'NOTA DE COBRO' : 'RECORDATORIO DE PAGO');
  let yy = kv(doc, y, [['Fecha', fdate(h)], ['Señor(a)', per.nombre], ['Cédula', per.cedula], ['Obligación No.', pad(c.consecutivo)]]);
  const pend = q => Number(q.valor) - Number(q.pagado), total = lista.reduce((t, q) => t + pend(q), 0);
  yy = parrafo(doc, yy + 2, venc.length
    ? `Le informamos que, a la fecha, la obligación No. ${pad(c.consecutivo)} presenta ${venc.length} cuota(s) vencida(s) sin pagar. Le agradecemos acercarse a realizar el pago o comunicarse con nosotros para acordar la forma de ponerse al día.`
    : `Le recordamos amablemente la próxima cuota de su obligación No. ${pad(c.consecutivo)}.`);
  doc.autoTable({ ...tablaEstilo, startY: yy,
    head: [['Cuota', 'Vence', 'Valor cuota', 'Abonado', 'Pendiente', 'Días de atraso']],
    body: lista.map(q => [q.numero, fdate(q.fecha_vencimiento), money(q.valor), money(q.pagado), money(pend(q)), q.fecha_vencimiento < h ? diasEntre(q.fecha_vencimiento, h) : 0]),
    foot: [['', '', '', 'Total', money(total), '']], columnStyles: { 0: { halign: 'center' }, 1: { halign: 'center' } } });
  yy = doc.lastAutoTable.finalY + 8;
  yy = negrita(doc, yy, 'Valor a pagar: ' + money(total));
  doc.text('Saldo total de la obligación: ' + money(k.saldo), 15, yy); yy += 8;
  if (negocio.telefono) yy = parrafo(doc, yy, `Para cualquier aclaración, comuníquese al ${negocio.telefono}.`);
  firmaYGuardar(doc, yy, `${venc.length ? 'Cobro' : 'Recordatorio'}_${pad(c.consecutivo)}_${nom(per.nombre)}.pdf`);
}

function docCartera(lista, vista) {
  const { doc, y } = nuevoDoc('ESTADO DE CARTERA');
  const yy = kv(doc, y, [['Fecha', fdate(hoy())], ['Vista', vista], ['Préstamos', String(lista.length)]]);
  const filas = lista.map(c => ({ c, a: cuotaAPagar(c.k, c) }));
  const body = filas.map(({ c, a }) => [pad(c.consecutivo), c.personas?.nombre || '', c.personas?.cedula || '', estadoCuenta(c, c.k)[0], money(c.k.pagado), money(c.k.saldo), a ? money(a.valor) : '—', a ? fdate(a.fecha) : '—']);
  const tot = f => lista.reduce((s, c) => s + f(c), 0);
  doc.autoTable({ ...tablaEstilo, startY: yy, styles: { fontSize: 8, halign: 'right' },
    head: [['#', 'Cliente', 'Cédula', 'Estado', 'Pagado', 'Saldo', 'Cuota a pagar', 'Vence']], body,
    foot: [['', 'Total', '', '', money(tot(c => c.k.pagado)), money(tot(c => c.k.saldo)), money(filas.reduce((s, f) => s + (f.a ? f.a.valor : 0), 0)), '']],
    columnStyles: { 0: { halign: 'center' }, 1: { halign: 'left' }, 2: { halign: 'left' }, 3: { halign: 'left' }, 7: { halign: 'center' } },
    didParseCell: d => {
      if (d.section !== 'body') { if ([1, 2, 3].includes(d.column.index)) d.cell.styles.halign = 'left'; return; }

    } });
  guardarPie(doc, `Estado_de_cartera_${hoy()}.pdf`);
}

function docPazYSalvo(c, k, per, pagos) {
  if (c.estado !== 'pagado') throw new Error('El paz y salvo solo se genera cuando el préstamo está pagado.');
  const activos = (pagos || []).filter(p => p.estado === 'activo');
  const fcan = activos.length ? activos.map(p => p.fecha).sort().pop() : hoy();
  const { doc, y } = nuevoDoc('PAZ Y SALVO');
  let yy = parrafo(doc, y + 2, `${negocio.ciudad ? negocio.ciudad + ', ' : ''}${fdate(hoy())}`);
  yy = parrafo(doc, yy + 4, `${negocio.representante ? `El(la) suscrito(a) ${negocio.representante}, en representación de ` : 'Por medio del presente documento, '}${negocio.nombre}${negocio.nit ? ` (NIT / CC ${negocio.nit})` : ''}, hace constar que ${per.nombre}, identificado(a) con cédula de ciudadanía No. ${per.cedula}, canceló la totalidad de la obligación No. ${pad(c.consecutivo)}, desembolsada el ${fdate(c.fecha_desembolso)} por un capital de ${money(c.capital)}, con fecha de cancelación ${fdate(fcan)}.`);
  if (Number(c.descuento) > 0) yy = parrafo(doc, yy + 2, `Se deja constancia de que, por acuerdo entre las partes, se otorgó un descuento de ${money(c.descuento)} sobre el saldo de la obligación.`);
  yy = parrafo(doc, yy + 2, 'En consecuencia, a la fecha de este documento el(la) deudor(a) se encuentra a PAZ Y SALVO por concepto de esta obligación.');
  yy = parrafo(doc, yy + 2, 'Se expide a solicitud del interesado(a).');
  firmaYGuardar(doc, yy, `PazYSalvo_${pad(c.consecutivo)}_${nom(per.nombre)}.pdf`);
}

/* ---------------- ESTADÍSTICAS ---------------- */
let vistaEst = 'graf', estDatos = null;
const MES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const mesCorto = m => MES_C[Number(m.slice(5, 7)) - 1];
const mesLargo = m => MES_L[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(0, 4);
const num = n => Number(n || 0);
const pct = (a, b) => b > 0 ? Math.round(a * 100 / b) : 0;
function compacto(n) {
  n = num(n); const a = Math.abs(n);
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.', ',').replace(',0', '') + ' M';
  if (a >= 1e3) return Math.round(n / 1e3) + ' mil';
  return String(Math.round(n));
}
const dineroC = n => '$' + compacto(n);
function hace(dias) {
  dias = num(dias);
  if (dias < 1) return 'hoy';
  if (dias < 45) return `hace ${dias} día${dias === 1 ? '' : 's'}`;
  if (dias < 730) { const m = Math.round(dias / 30.4); return `hace ${m} meses`; }
  const a = Math.floor(dias / 365), m = Math.round((dias - a * 365) / 30.4);
  return `hace ${a} año${a === 1 ? "" : "s"}` + (m > 0 && m < 12 ? ` y ${m} mes${m === 1 ? '' : 'es'}` : '');
}
function ticks(max) {
  if (max <= 0) return [0, 1];
  const p = Math.pow(10, Math.floor(Math.log10(max / 3)));
  const paso = [1, 2, 5, 10].map(f => f * p).find(s => max / s <= 4) || 10 * p;
  const t = []; for (let v = 0; v <= max + paso * 0.001; v += paso) t.push(v);
  if (t[t.length - 1] < max) t.push(t[t.length - 1] + paso);
  return t;
}
// Barra con el extremo superior redondeado (4px) y la base recta
function barraPath(x, y, w, h, redondear) {
  const r = redondear ? Math.min(4, w / 2, h) : 0;
  return `M${x},${y + h}V${y + r}${r ? `Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}` : `H${x + w}`}V${y + h}Z`;
}
// Gráfico de columnas (apiladas o simples). series: [{k, nombre, color}]
function columnas(id, filas, series, opts = {}) {
  const W = 340, H = 180, pl = 46, pr = 6, pt = 10, pb = 24, iw = W - pl - pr, ih = H - pt - pb;
  const tot = f => series.reduce((s, x) => s + num(f[x.k]), 0);
  const tk = ticks(Math.max(...filas.map(tot), 0));
  const top = tk[tk.length - 1] || 1;
  const slot = iw / filas.length, bw = Math.min(24, slot - 6);
  const Y = v => pt + ih - (v / top) * ih;
  let g = tk.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}" class="v-grid"/><text x="${pl - 5}" y="${Y(t) + 3.5}" text-anchor="end" class="v-eje">${opts.dinero === false ? compacto(t) : compacto(t)}</text>`).join('');
  filas.forEach((f, i) => {
    const cx = pl + slot * i + slot / 2, x = cx - bw / 2;
    let acum = 0;
    const vis = series.filter(s => num(f[s.k]) > 0);
    vis.forEach((s, j) => {
      const v = num(f[s.k]), y0 = Y(acum + v), h = Math.max(Y(acum) - y0 - (vis.length > 1 && j < vis.length - 1 ? 0 : 0), 0);
      const gap = j > 0 ? 2 : 0;           // 2px de superficie entre segmentos apilados
      const yy = y0, hh = Math.max(h - gap, 1);
      g += `<path d="${barraPath(x, yy, bw, hh, j === vis.length - 1)}" class="v-barra" style="fill:var(${s.color})" data-i="${i}"/>`;
      acum += v;
    });
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" class="v-eje">${mesCorto(f.mes)}</text>`;
    g += `<rect x="${pl + slot * i}" y="${pt}" width="${slot}" height="${ih + pb}" class="v-hit" data-g="${id}" data-i="${i}" tabindex="0" role="img" aria-label="${mesLargo(f.mes)}: ${series.map(s => s.nombre + ' ' + (opts.fmt || money)(f[s.k])).join(', ')}"/>`;
  });
  g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(0)}" y2="${Y(0)}" class="v-base"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="v-svg" id="${id}" role="group">${g}</svg>`;
}
const leyenda = series => `<div class="v-ley">${series.map(s => `<span><i style="background:var(${s.color})"></i>${s.nombre}</span>`).join('')}</div>`;
function barrasH(filas, color, fmt = money) {
  const max = Math.max(...filas.map(f => num(f.v)), 1);
  return filas.map(f => `<div class="v-fila"><div class="v-et">${esc(f.et)}</div><div class="v-pista"><div class="v-rel" style="width:${Math.max(num(f.v) / max * 100, num(f.v) > 0 ? 1.5 : 0)}%;background:var(${f.color || color})"></div></div><div class="v-val">${esc(fmt(f.v))}${f.sub ? `<small>${esc(f.sub)}</small>` : ''}</div></div>`).join('');
}

// Tooltip: lista todas las series de la columna; el texto entra con textContent
function activarTips(mapa) {
  const tip = $('#v-tip'); if (!tip) return;
  const cont = tip.parentElement;
  const ocultar = () => { tip.hidden = true; document.querySelectorAll('.v-barra.on').forEach(b => b.classList.remove('on')); };
  const mostrar = el => {
    const [filas, series, fmt] = mapa[el.dataset.g], f = filas[Number(el.dataset.i)];
    tip.textContent = '';
    const t = document.createElement('div'); t.className = 'v-tt'; t.textContent = mesLargo(f.mes); tip.appendChild(t);
    series.forEach(s => {
      const row = document.createElement('div'); row.className = 'v-tr';
      const k = document.createElement('i'); k.style.background = `var(${s.color})`;
      const val = document.createElement('b'); val.textContent = fmt(f[s.k]);
      const nom = document.createElement('span'); nom.textContent = s.nombre;
      row.append(k, val, nom); tip.appendChild(row);
    });
    document.querySelectorAll('.v-barra.on').forEach(b => b.classList.remove('on'));
    el.parentNode.querySelectorAll(`.v-barra[data-i="${el.dataset.i}"]`).forEach(b => b.classList.add('on'));
    tip.hidden = false;
    const c = cont.getBoundingClientRect(), r = el.getBoundingClientRect(), w = tip.offsetWidth;
    let x = r.left - c.left + r.width / 2 - w / 2; x = Math.max(4, Math.min(x, c.width - w - 4));
    tip.style.left = x + 'px'; tip.style.top = (r.top - c.top - tip.offsetHeight - 6) + 'px';
  };
  document.querySelectorAll('.v-hit').forEach(el => {
    el.addEventListener('pointerenter', () => mostrar(el));
    el.addEventListener('pointermove', () => mostrar(el));
    el.addEventListener('pointerleave', ocultar);
    el.addEventListener('focus', () => mostrar(el));
    el.addEventListener('blur', ocultar);
  });
}

let alertasCache = null;
const DIAS_AVISO = 3;
async function datosAlertas() {
  const { data, error } = await sb.from('cuentas').select('*,personas(nombre,cedula,telefono),cuotas(numero,fecha_vencimiento,valor,pagado)').eq('estado', 'vigente').limit(1000);
  if (error) throw new Error(error.message);
  const h = hoy(), mora = [], hoyL = [], prox = [];
  (data || []).forEach(c => {
    const k = calcCuenta(c);
    if (k.mora) { mora.push({ c, k, valor: k.vencido, dias: k.diasMora }); return; }
    const pend = k.cu.filter(q => Number(q.pagado) < Number(q.valor));
    const dHoy = pend.filter(q => q.fecha_vencimiento === h);
    if (dHoy.length) { hoyL.push({ c, k, valor: dHoy.reduce((s, q) => s + Number(q.valor) - Number(q.pagado), 0), fecha: h }); return; }
    const q = pend.find(x => diasEntre(h, x.fecha_vencimiento) >= 1 && diasEntre(h, x.fecha_vencimiento) <= DIAS_AVISO);
    if (q) prox.push({ c, k, valor: Number(q.valor) - Number(q.pagado), fecha: q.fecha_vencimiento });
  });
  mora.sort((a, b) => b.dias - a.dias); prox.sort((a, b) => a.fecha.localeCompare(b.fecha));
  alertasCache = { t: Date.now(), n: mora.length + hoyL.length, mora, hoy: hoyL, prox };
  return alertasCache;
}

    if (b && a.n > 0) { b.textContent = TAB_NOMBRE.alertas + ' '; const s = document.createElement('span'); s.className = 'badge'; s.textContent = a.n; b.appendChild(s); }

}

let impDatos = null;
function cargarXlsx() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, mal) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = ok; s.onerror = () => mal(new Error('No se pudo cargar el lector de Excel. Revisa tu conexión a internet.'));
    document.head.appendChild(s);
  });
}
function descargarPlantilla() {
  const bin = atob(PLANTILLA_B64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([u8], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  a.download = 'Plantilla_carga_masiva.xlsx'; document.body.appendChild(a); a.click(); a.remove();
}
const txt = v => String(v ?? '').trim();
const idTxt = v => typeof v === 'number' ? String(Math.round(v)) : txt(v).replace(/\s/g, '').replace(/\.0+$/, '');
function numero(v) {
  if (typeof v === 'number') return v;
  let s = txt(v).replace(/[$\s]/g, '');
  if (!s) return null;
  if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
  else s = s.replace(',', '.');
  const n = Number(s); return isNaN(n) ? NaN : n;
}
function fechaIso(v) {
  if (v === '' || v == null) return null;
  const f = (y, m, d) => { const dt = new Date(Date.UTC(y, m - 1, d)); return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d ? dt.toISOString().slice(0, 10) : undefined; };
  if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 86400000)); return f(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
  if (v instanceof Date) return f(v.getFullYear(), v.getMonth() + 1, v.getDate());
  let m = txt(v).match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (m) return f(+m[3], +m[2], +m[1]);
  m = txt(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m ? f(+m[1], +m[2], +m[3]) : undefined;
}
function leerHoja(wb, nombre) {
  const ws = wb.Sheets[nombre];
  if (!ws) return null;
  const filas = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
  return filas.map((r, i) => ({ fila: i + 1, r })).slice(1)
    .filter(x => x.r.slice(0, 9).some(c => txt(c) !== '') && !/^ejemplo/i.test(txt(x.r[0])));
}
function analizarLibro(wb) {
  const out = { clientes: [], prestamos: [], malC: [], malP: [], faltan: [] };
  const hc = leerHoja(wb, 'Clientes'), hp = leerHoja(wb, 'Préstamos');
  if (!hc) out.faltan.push('Clientes'); if (!hp) out.faltan.push('Préstamos');
  (hc || []).forEach(({ fila, r }) => {
    const x = { fila, cedula: idTxt(r[0]), nombre: txt(r[1]), telefono: idTxt(r[2]), tipo: txt(r[3]).toLowerCase() || 'cliente', direccion: txt(r[4]), barrio: txt(r[5]), notas: txt(r[6]), consentimiento: /^(si|sí|s|x|1|true)$/i.test(txt(r[7])) };
    const p = [];
    if (!x.cedula) p.push('falta la cédula'); if (!x.nombre) p.push('falta el nombre'); if (!x.telefono) p.push('falta el teléfono');
    if (!['cliente', 'fiador', 'referencia'].includes(x.tipo)) p.push('tipo inválido');
    if (x.cedula && out.clientes.some(c => c.cedula === x.cedula)) p.push('cédula repetida en el archivo');
    p.length ? out.malC.push({ fila, motivo: p.join(', ') }) : out.clientes.push(x);
  });
  (hp || []).forEach(({ fila, r }) => {
    const cap = numero(r[1]), tasa = numero(r[2]), cuo = numero(r[4]), pag = numero(r[6]), abo = numero(r[7]);
    const x = { fila, cedula: idTxt(r[0]), capital: cap, tasa: tasa == null ? '' : tasa, frecuencia: txt(r[3]).toLowerCase(), cuotas: cuo, fecha: fechaIso(r[5]), pagadas: pag, abono: abo == null ? 0 : abo, fecha_abono: fechaIso(r[8]) || '' };
    const p = [];
    if (!x.cedula) p.push('falta la cédula');
    if (!cap || isNaN(cap) || cap <= 0) p.push('capital inválido');
    if (tasa != null && (isNaN(tasa) || tasa < 0 || tasa > 100)) p.push('tasa inválida');
    if (!['semanal', 'quincenal', 'mensual'].includes(x.frecuencia)) p.push('frecuencia debe ser semanal, quincenal o mensual');
    if (!cuo || isNaN(cuo) || cuo < 1 || cuo % 1) p.push('número de cuotas inválido');
    if (!x.fecha) p.push('fecha de desembolso ' + (r[5] === '' ? 'faltante' : 'inválida'));
    if (pag == null || isNaN(pag) || pag < 0 || pag % 1) p.push('escribe las cuotas ya pagadas (0 si ninguna)');
    else if (cuo && pag > cuo) p.push('hay más cuotas pagadas que cuotas');
    if (abo != null && (isNaN(abo) || abo < 0)) p.push('abono inválido');
    p.length ? out.malP.push({ fila, motivo: p.join(', ') }) : out.prestamos.push(x);
  });
  return out;
}
const lotes = (a, n = 200) => { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; };

    <p class="mute" style="font-size:13px">Los clientes que ya existen y los préstamos ya cargados no se duplican ni se modifican.</p>
    <button id="i-go" ${hayAlgo ? '' : 'disabled'}>Cargar ${puedeC ? d.clientes.length + ' cliente(s)' : ''}${puedeC && puedeP ? ' y ' : ''}${puedeP ? d.prestamos.length + ' préstamo(s)' : ''}</button>
    </div><div id="i-fin"></div>`;
  $('#i-go').onclick = () => cargarTodo(puedeC, puedeP);
}
async function cargarTodo(puedeC, puedeP) {
  const d = impDatos, fin = $('#i-fin'), btn = $('#i-go');
  btn.disabled = true; fin.innerHTML = '<p class="mute">Cargando… no cierres esta pantalla.</p>';
  const resumen = { C: { creados: 0, omitidos: 0, errores: [] }, P: { creados: 0, omitidos: 0, errores: [] } };
  try {
    if (puedeC && d.clientes.length) for (const l of lotes(d.clientes)) {
      const { data, error } = await sb.rpc('importar_clientes', { p_filas: l });
      if (error) throw new Error(error.message);
      resumen.C.creados += data.creados; resumen.C.omitidos += data.omitidos; resumen.C.errores.push(...data.errores);
    }
    if (puedeP && d.prestamos.length) for (const l of lotes(d.prestamos)) {
      const { data, error } = await sb.rpc('importar_prestamos', { p_filas: l });
      if (error) throw new Error(error.message);
      resumen.P.creados += data.creados; resumen.P.omitidos += data.omitidos; resumen.P.errores.push(...data.errores);
    }
  } catch (e) { fin.innerHTML = `<div class="msg err">Se detuvo la carga: ${esc(e.message)}. Lo ya cargado quedó guardado; puedes volver a subir el archivo sin duplicar.</div>`; btn.disabled = false; return; }
  alertasCache = null; estDatos = null;
  const err = (l, hoja) => l.length ? `<details open><summary>Avisos de «${hoja}» (${l.length})</summary><ul class="prob">${l.map(x => `<li>Fila ${x.fila}: ${esc(x.motivo)}</li>`).join('')}</ul></details>` : '';
  fin.innerHTML = `<div class="card"><h2>Resultado</h2>
    <div class="stats" style="margin-bottom:8px">
      <div class="stat"><span>Clientes cargados</span><b>${resumen.C.creados}</b><small class="mute">${resumen.C.omitidos} ya existían</small></div>
      <div class="stat"><span>Préstamos cargados</span><b>${resumen.P.creados}</b><small class="mute">${resumen.P.omitidos} ya estaban</small></div></div>
    ${err(resumen.C.errores, 'Clientes')}${err(resumen.P.errores, 'Préstamos')}
    <p style="margin-bottom:0"><button id="i-ver">Ver préstamos</button> <button class="sec" id="i-alert">Ver alertas de cobro</button></p></div>`;
  $('#i-ver').onclick = () => { tab = 'prestamos'; cuentaSel = null; render(); };
  $('#i-alert').onclick = () => { tab = 'alertas'; render(); };
}
