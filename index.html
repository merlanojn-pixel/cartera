<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}

.row{display:flex;gap:8px;align-items:center;justify-content:space-between}

.item{padding:12px 0;border-top:1px solid var(--line)}

.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute);margin-left:6px}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}

.msg.err{background:#fee4e2;color:#7a271a}

.matrix{width:100%;border-collapse:collapse;font-size:14px}
.matrix th,.matrix td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
.matrix td:first-child,.matrix th:first-child{text-align:left}

nav{overflow-x:auto}

.viz{--v-cap:#2a78d6;--v-gan:#1baf7a;--v-r1:#6da7ec;--v-r2:#3987e5;--v-r3:#256abf;--v-r4:#184f95;--v-grid:#e1e0d9;--v-base:#c3c2b7;--v-eje:#898781;position:relative}

.sub{font-size:12.5px;margin:2px 0 8px}
.card h3{font-size:14px;margin:14px 0 2px}
.v-split{display:flex;gap:2px;height:14px}

.v-dos>div{display:flex;flex-direction:column;gap:1px;font-size:13px;color:var(--mute)}
.v-dos i,.v-ley i,.v-tr i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-bottom:2px}

.v-eje{fill:var(--v-eje);font-size:10px}
.v-hit{fill:transparent;cursor:pointer;outline:none}
.v-hit:focus-visible{stroke:var(--ink);stroke-width:1;stroke-opacity:.4}
.v-barra.on{filter:brightness(1.12)}
.v-tip{position:absolute;z-index:6;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px #0002;pointer-events:none;white-space:nowrap}

a.btn{display:inline-block;text-decoration:none;background:var(--brand);color:#fff;border-radius:10px;padding:12px 16px;font:inherit;text-align:center}

a.btn.sec{background:transparent;color:var(--brand);border:1px solid var(--line)}
.prob{margin:6px 0 0;padding-left:20px;font-size:13px;color:var(--ink)}
details summary{cursor:pointer}
input[type=file]{padding:10px}
.hd-btns button{white-space:nowrap}

.item.mora{border-left:4px solid var(--bad);padding-left:10px}
tr.fila-mora td:first-child{border-left:4px solid var(--bad)}
.stat.avs{cursor:pointer}

.pest{display:flex;gap:6px;overflow-x:auto;margin:12px -2px;padding:2px}

table a.btn.sm{padding:4px 7px;font-size:12px}

.tag.ok{color:var(--ok);border-color:var(--ok)}

.res-lista{margin-top:6px}
.res-cli{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:0 0 6px;font-size:15px}
.cli-elegido{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#ecf5ef;border:1px solid #bfd8c8;border-radius:10px;padding:10px 12px;margin-top:6px}

<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script>
// ======== CONFIGURACIÓN (pegar los datos del proyecto Supabase de esta instalación) ========
const SUPABASE_URL = 'https://xyjzsxrordwztizhuizm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5anpzeHJvcmR3enRpemh1aXptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MTAzMjksImV4cCI6MjEwNzM4NjMyOX0.e9mG5xKU2wQrfgfJp8_xoFR4ZJmkwcznAnGaSuv7a5w';
// Nombre de la plataforma (lo que ve cualquiera antes de entrar). 
const NOMBRE_PLATAFORMA = 'CAPITALIA';
const NOMBRE_NEGOCIO = 'Mi negocio'; // solo mientras carga; el nombre real viene de cada negocio
const MAX_INTENTOS = 5, MIN_BLOQUEO = 15; // deben coincidir con 04_acceso.sql
// ============================================================================================

const MODULOS = [['personas','Clientes'],['prestamos','Préstamos'],['fiados','Fiados'],['pagos','Pagos'],['caja','Caja'],['reportes','Estadísticas']];
const ACCIONES = ['ver','crear','editar','anular','exportar'];
const limpiarUsuario = s => String(s || '').trim().toLowerCase().replace(/\s+/g, '');
// La cuenta se escribe usuario@código-del-negocio (ej: maria@inversionesvitola)
const partirCuenta = s => { const t = limpiarUsuario(s), i = t.lastIndexOf('@'); return i < 1 ? null : { usuario: t.slice(0, i), codigo: t.slice(i + 1) }; };
const tasaDe = tipo => { const v = tipo === 'fiado' ? negocio.tasa_credito : negocio.tasa_prestamo; return v == null || v === '' ? (tipo === 'fiado' ? 10 : 20) : v; };
const cuentaDe = u => (u && u.usuario ? u.usuario + '@' + (negocio.codigo || '') : '');

if (typeof supabase === 'undefined' || !/^https:\/\/.+\..+/.test(SUPABASE_URL) || /PEGA_AQUI/.test(SUPABASE_KEY)) {
  const msg = typeof supabase === 'undefined' ? 'No se pudo cargar la librería de conexión. Revisa tu internet y recarga la página.' : 'Falta configurar la conexión: en las dos primeras líneas del script de este archivo hay que pegar la URL y la clave publishable de tu proyecto en Supabase.';
  document.addEventListener('DOMContentLoaded', () => { document.body.innerHTML = '<div style="font-family:system-ui,sans-serif;max-width:420px;margin:40px auto;padding:20px;border:1px solid #ccc;border-radius:12px"><h2 style="margin-top:0">CAPITALIA</h2><p>' + msg + '</p></div>'; });
  throw new Error(msg);
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let me = null, perms = new Set(), tab = 'prestamos', aviso = null, rolSel = null, negocio = { nombre: NOMBRE_NEGOCIO };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const can = (m, a) => !!me && (me.es_admin || perms.has(m + ':' + a));
const alertaEn = (id, t) => { const e = $('#' + id); if (e) { e.innerHTML = '<div class="msg err">' + esc(t) + '</div>'; try { e.scrollIntoView({ block: 'nearest' }); } catch (x) {} } };
const normCed = s => String(s || '').replace(/[\s.\-]/g, '');
const setAviso = (t, tipo = 'err') => { aviso = t ? { t, tipo } : null; };
const avisoHtml = () => aviso ? `<div class="msg ${aviso.tipo}">${esc(aviso.t)}</div>` : '';

async function init() {
  if (SUPABASE_URL.startsWith('PEGA')) {
    $('#app').innerHTML = '<main><div class="card"><h2>Falta configurar</h2><p class="mute">Edita el archivo y pega la URL y la clave publishable de tu proyecto Supabase al inicio del script.</p></div></main>';
    return;
  }
  const { data } = await sb.auth.getSession();
  if (data.session) await cargarYo(); else vistaLogin();
}

async function cargarYo() {
  const { data: u } = await sb.auth.getUser();
  if (!u.user) return vistaLogin();
  const { data: p, error } = await sb.from('perfiles').select('*').eq('id', u.user.id).single();
  if (error || !p) { await sb.auth.signOut(); setAviso('No se encontró tu perfil.'); return vistaLogin(); }
  me = p; perms = new Set();
  alertasCache = null; negocio = { nombre: NOMBRE_NEGOCIO };
  if (!p.es_plataforma) {
    const { data: nx } = await sb.from('negocios').select('*').maybeSingle();
    if (!nx || nx.estado !== 'activo') { await sb.auth.signOut(); me = null; setAviso('Este negocio está suspendido o no está disponible. Comunícate con el soporte de la plataforma.'); return vistaLogin(); }
    negocio = { ...(nx.config || {}), id: nx.id, nombre: nx.nombre, codigo: nx.codigo };
  }
  if (!p.es_admin && p.role_id) {
    const { data: pm } = await sb.from('permisos').select('modulo,accion').eq('role_id', p.role_id);
    (pm || []).forEach(x => perms.add(x.modulo + ':' + x.accion));
  }
  if (!p.activo || (!p.es_admin && !p.es_plataforma && !p.role_id)) {
    await sb.auth.signOut(); me = null;
    setAviso('Tu cuenta todavía no tiene acceso. Pídele al administrador que la habilite.');
    return vistaLogin();
  }
  if (!tabsVisibles().includes(tab)) tab = tabsVisibles()[0] || 'personas';
  if (p.es_plataforma && tab === 'personas') tab = 'negocios';
  render();
}

function vistaLogin() {
  marcaPestana(true);
  $('#app').innerHTML = `<div class="login">
    <h1 class="marca" style="text-align:center;color:var(--brand);margin-bottom:4px">${esc(NOMBRE_PLATAFORMA)}</h1>
    <p class="mute" style="text-align:center;margin:0 0 14px">Administra tu negocio de préstamos</p>
    <form class="card" id="l-form" autocomplete="on">
      <h2>Iniciar sesión</h2>
      ${avisoHtml()}
      <label>Tu cuenta</label><input id="l-mail" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email" placeholder="usuario@negocio">
      <p class="mute" style="font-size:12px;margin:4px 0 0">Es el usuario y el código de tu negocio, separados por @. Si no lo sabes, pídeselo a tu administrador.</p>
      <label>Clave</label><input id="l-pass" type="password" autocomplete="current-password">
      <div style="margin-top:14px"><button style="width:100%" id="l-go" type="submit">Entrar</button></div>
      <p class="mute" style="font-size:12px;margin:12px 0 0;text-align:center">Después de ${MAX_INTENTOS} intentos fallidos el usuario se bloquea ${MIN_BLOQUEO} minutos.</p>
    </form></div>`;
  $('#l-form').onsubmit = async ev => {
    ev.preventDefault();
    const usuario = limpiarUsuario($('#l-mail').value), password = $('#l-pass').value;
    if (!usuario || !password) { setAviso('Escribe el usuario y la clave.'); return vistaLogin(); }
    const cta = partirCuenta(usuario);
    if (!cta) { setAviso('Escribe tu cuenta completa, con el código de tu negocio. Ejemplo: maria@minegocio'); return vistaLogin(); }
    $('#l-go').disabled = true;
    setAviso(null);
    // La clave se verifica en el servidor, que cuenta los intentos fallidos y bloquea al llegar al límite
    const { data: r, error: e0 } = await sb.rpc('verificar_acceso', { p_usuario: cta.usuario, p_codigo: cta.codigo, p_clave: password });
    if (e0) { setAviso('No se pudo verificar el acceso: ' + e0.message); return vistaLogin(); }
    if (r && r.estado === 'bloqueado') { setAviso(`Demasiados intentos fallidos. Este usuario está bloqueado, intenta de nuevo en ${Math.ceil((r.segundos || 60) / 60)} minuto(s).`); return vistaLogin(); }
    if (!r || r.estado !== 'ok') { setAviso('Usuario o clave incorrectos.'); return vistaLogin(); }
    const { error } = await sb.auth.signInWithPassword({ email: r.email, password });
    if (error) { setAviso('Usuario o clave incorrectos.'); return vistaLogin(); }
    await cargarYo();
  };
}

function tabsVisibles() {
  if (me && me.es_plataforma) return ['negocios'];
  const t = [];
  if (can('prestamos', 'ver')) t.push('prestamos');
  if (can('reportes', 'ver')) t.push('estadisticas');
  if (can('personas', 'ver')) t.push('personas');
  if (me && me.es_admin) t.push('usuarios', 'config');
  return t;
}

/* ---------------- PUNTOS DE MIL Y BUSCADOR DE CLIENTE ---------------- */
const milesTxt = n => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
function formatearMiles(t) {
  const antes = t.value, pos = t.selectionStart == null ? antes.length : t.selectionStart;
  const dig = antes.slice(0, pos).replace(/\D/g, '').length, solo = antes.replace(/\D/g, '');
  const f = solo ? milesTxt(solo) : '';
  if (f === antes) return;
  t.value = f;
  let n = 0, i = 0;

const sinTildes = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
let clientesBusca = [];
function buscarClientes(q) {
  const ts = sinTildes(q).split(/\s+/).filter(Boolean);
  if (!ts.length) return [];
  return clientesBusca.filter(p => {
    const t = sinTildes(p.nombre) + ' ' + String(p.cedula || '').replace(/\D/g, '');
    return ts.every(x => t.includes(x.replace(/\./g, '')));
  }).slice(0, 6);
}

function inicialesNegocio(nom) {
  const ruido = /^(de|del|la|las|el|los|y|e|inversiones|prestamos|préstamos|creditos|créditos|capital|negocio|empresa|grupo|sas|s\.a\.s)$/i;
  const w = String(nom || '').trim().split(/\s+/).filter(x => x && !ruido.test(x));
  if (!w.length) return String(nom || 'C').trim().slice(0, 2).toUpperCase() || 'C';
  if (/^[A-ZÁÉÍÓÚÑ]{2,3}$/.test(w[0])) return w[0];
  return w.length > 1 ? (w[0][0] + w[1][0]).toUpperCase() : w[0].slice(0, 2).toUpperCase();
}
function favNegocio() {
  if (negocio.logo) return negocio.logo;
  try {
    const cv = document.createElement('canvas'); cv.width = cv.height = 64;
    const x = cv.getContext('2d');
    x.fillStyle = '#14532d'; x.beginPath(); x.arc(32, 32, 32, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = 'bold 28px Arial, sans-serif';
    x.fillText(inicialesNegocio(negocio.nombre), 32, 34);

  } catch (e) { return FAV_CAPITALIA; }
}

}

/* ======================= PRÉSTAMOS ======================= */
const hoy = () => new Date().toLocaleDateString('en-CA');
const money = n => '$' + (Number(n || 0) < 0 ? '-' : '') + milesTxt(Math.abs(Number(n || 0)));
const fdate = s => s ? String(s).slice(0, 10).split('-').reverse().join('/') : '';
const diasEntre = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const entero = s => Number(String(s ?? '').replace(/\D/g, '')) || 0;
const decimal = s => Number(String(s ?? '').replace(',', '.'));
// Número que ve el cliente: arranca en 1001 para cada negocio
const pad = n => String(1000 + Number(n));
const nom = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '_').replace(/^_+|_+$/g, '');
const FREQ = { semanal: 'Semanal', quincenal: 'Quincenal', mensual: 'Mensual' };
const PERIODOS_MES = { semanal: 4, quincenal: 2, mensual: 1 };
const ORD_MES = ['', 'primer', 'segundo', 'tercer', 'cuarto', 'quinto', 'sexto', 'séptimo', 'octavo', 'noveno', 'décimo', 'undécimo', 'duodécimo'];
let cuentaSel = null, filtroPres = 'todos', vistaPres = 'tabla';

function calcCuenta(c) {
  const cu = (c.cuotas || []).slice().sort((a, b) => a.numero - b.numero);
  const pagado = cu.reduce((s, q) => s + Number(q.pagado), 0);
  const saldo = c.estado === 'anulado' ? 0 : Math.max(0, Number(c.total) - Number(c.descuento || 0) - pagado);
  const h = hoy();
  const sinPagar = q => Number(q.pagado) < Number(q.valor);
  const atrasadas = c.estado === 'vigente' ? cu.filter(q => q.fecha_vencimiento < h && sinPagar(q)) : [];
  const vencido = Math.min(saldo, atrasadas.reduce((s, q) => s + Number(q.valor) - Number(q.pagado), 0));
  const proxima = c.estado === 'vigente' ? cu.find(sinPagar) || null : null;
  return { cu, pagado, saldo, atrasadas, vencido, proxima, mora: atrasadas.length > 0,
    diasMora: atrasadas.length ? diasEntre(atrasadas[0].fecha_vencimiento, h) : 0 };
}
const estadoCuenta = (c, k) => c.estado === 'anulado' ? ['Anulado', ''] : c.estado === 'refinanciado' ? ['Refinanciado', ''] : c.estado === 'pagado' ? ['Paz y salvo', 'ok'] : k.mora ? ['En mora', 'bad'] : ['Al día', 'ok'];
// Lo que el cliente debe pagar ahora: lo vencido si está en mora, o la próxima cuota.
function cuotaAPagar(k, c) {
  if (c.estado !== 'vigente') return null;
  if (k.mora) return { valor: k.vencido, fecha: k.atrasadas[0].fecha_vencimiento, vencida: true };
  if (k.proxima) return { valor: Math.min(k.saldo, Number(k.proxima.valor) - Number(k.proxima.pagado)), fecha: k.proxima.fecha_vencimiento, vencida: false };
  return null;
}
// Interés por mes empezado: meses = cuotas ÷ cuotas por mes, redondeado hacia arriba
const interesMes = (cap, tasa, fre, n) => { const m = Math.ceil(n / PERIODOS_MES[fre]); return { meses: m, inte: Math.round(cap * tasa / 100 * m) }; };
const mesesDe = c => { const b = Number(c.capital) * Number(c.tasa_mensual) / 100; return b ? Math.round(Number(c.interes_total) / b * 100) / 100 : 0; };
const mesesTxt = m => (Number.isInteger(m) ? String(m) : String(m)) + (m === 1 ? ' mes' : ' meses');
const NOMBRES_FILTRO = { todos: 'Todos', mora: 'En mora', hoy: 'Cobran hoy', prox: 'Próximos 3 días', vigentes: 'Vigentes', pagados: 'Paz y salvo', refinanciados: 'Refinanciados', anulados: 'Anulados' };
const btnWa = c => { if (c.estado !== 'vigente' || c.u > 2) return ''; const w = enlaceCobro(c, c.k); return w ? `<a class="btn sm" href="${w}" target="_blank" rel="noopener" onclick="event.stopPropagation()">WhatsApp</a>` : '<span class="mute" style="font-size:12px">Sin teléfono</span>'; };

function tablaPrestamos(lista) {
  const filas = lista.map(c => ({ c, a: cuotaAPagar(c.k, c) }));
  const totPag = lista.reduce((s, c) => s + c.k.pagado, 0), totSal = lista.reduce((s, c) => s + c.k.saldo, 0), totCuo = filas.reduce((s, f) => s + (f.a ? f.a.valor : 0), 0);
  return `<div style="overflow-x:auto;margin:0 -14px"><table class="matrix tabla"><thead><tr><th>Cliente</th><th>Pagado</th><th>Saldo</th><th>Cuota a pagar</th></tr></thead><tbody>
    ${filas.map(({ c, a }) => `<tr data-c="${c.id}" class="${c.u === 0 ? 'fila-mora' : ''}" style="cursor:pointer"><td><b>${esc(c.personas?.nombre || '—')}</b><div class="mute" style="font-size:11px">#${pad(c.consecutivo)}${c.tipo === 'fiado' ? ' · Producto' + (c.descripcion ? ': ' + esc(c.descripcion) : '') : ''}</div>${tagHtml(estadoCuenta(c, c.k))}</td><td>${money(c.k.pagado)}</td><td><b>${money(c.k.saldo)}</b></td><td>${a ? `<b class="${a.vencida ? 'bad-t' : ''}">${money(a.valor)}</b><br><span class="mute">${a.vencida ? 'desde ' : 'vence '}${fdate(a.fecha).slice(0, 5)}</span>` : '—'}${btnWa(c) ? `<div style="margin-top:4px">${btnWa(c)}</div>` : ''}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>Total (${lista.length})</td><td>${money(totPag)}</td><td>${money(totSal)}</td><td>${money(totCuo)}</td></tr></tfoot></table></div>`;
}
function tarjetasPrestamos(lista) {
  return lista.map(c => `
    <div class="item ${c.u === 0 ? 'mora' : ''}" data-c="${c.id}" style="cursor:pointer">
      <div class="row"><div><b>#${pad(c.consecutivo)} · ${esc(c.personas?.nombre || '—')}</b> ${tagHtml(estadoCuenta(c, c.k))}${c.tipo === 'fiado' ? `<div class="mute" style="font-size:12px">Producto a crédito${c.descripcion ? ': ' + esc(c.descripcion) : ''}</div>` : ''}</div><b>${money(c.k.saldo)}</b></div>
      <div class="mute">${c.estado === 'vigente'
        ? (c.k.mora ? `${c.k.atrasadas.length} cuota(s) vencida(s) · ${c.k.diasMora} días de atraso · debe ${money(c.k.vencido)}`
          : c.k.proxima ? `Próxima cuota: ${fdate(c.k.proxima.fecha_vencimiento)} · ${money(Number(c.k.proxima.valor) - Number(c.k.proxima.pagado))}` : '')
        : `Capital ${money(c.capital)} · ${c.num_cuotas} cuotas`}</div>
      ${btnWa(c) ? `<div class="acciones" style="margin-top:8px">${btnWa(c)}</div>` : ''}
    </div>`).join('');
}
const tagHtml = ([t, cls]) => `<span class="tag ${cls}">${t}</span>`;

async function vPrestamos() {
  if (cuentaSel) return vCuenta();
  const v = $('#vista');
  v.innerHTML = '<p class="mute">Cargando…</p>';
  const [rc, rp] = await Promise.all([
    sb.from('cuentas').select('*,personas(nombre,cedula,telefono),cuotas(numero,fecha_vencimiento,valor,pagado)').order('creado_en', { ascending: false }).limit(500),
    (can('prestamos', 'crear') || can('fiados', 'crear')) ? sb.from('personas').select('id,nombre,cedula').eq('activo', true).order('nombre') : Promise.resolve({ data: [] })
  ]);
  if (rc.error) { v.innerHTML = `<div class="msg err">${esc(rc.error.message)}</div>`; return; }
  const clientes = rp.data || []; clientesBusca = clientes;
  const cuentas = rc.data.map(c => ({ ...c, k: calcCuenta(c) }));
  cuentas.forEach(c => { c.u = urgenciaDe(c, c.k); });
  const vig = cuentas.filter(c => c.estado === 'vigente');
  const h = hoy();
  const cartera = vig.reduce((s, c) => s + c.k.saldo, 0);
  const vencido = vig.reduce((s, c) => s + c.k.vencido, 0);
  const cobroHoy = vig.reduce((s, c) => s + c.k.cu.filter(q => q.fecha_vencimiento === h).reduce((t, q) => t + Math.max(0, Number(q.valor) - Number(q.pagado)), 0), 0);
  let lista = cuentas.filter(c => ({
    todos: c.estado !== 'anulado', vigentes: c.estado === 'vigente', mora: c.u === 0, hoy: c.u === 1, prox: c.u === 2,
    pagados: c.estado === 'pagado', refinanciados: c.estado === 'refinanciado', anulados: c.estado === 'anulado' })[filtroPres]);
  const fechaProx = c => c.k.proxima ? c.k.proxima.fecha_vencimiento : '9999';
  lista.sort((a, b) => a.u - b.u || (a.u === 0 ? b.k.diasMora - a.k.diasMora : 0) || fechaProx(a).localeCompare(fechaProx(b)));
  const gMora = cuentas.filter(c => c.u === 0), gHoy = cuentas.filter(c => c.u === 1), gProx = cuentas.filter(c => c.u === 2);
  const sumaAv = l => l.reduce((s, c) => s + (c.u === 0 ? c.k.vencido : (cuotaAPagar(c.k, c) || { valor: 0 }).valor), 0);
  const tileAv = (f, et, l, cls) => `<div class="stat avs ${cls} ${filtroPres === f ? 'sel' : ''}" data-f="${f}" role="button" tabindex="0"><span>${et}</span><b>${l.length}</b><small class="mute">${money(sumaAv(l))}</small></div>`;
  const cadena = [...gMora, ...gHoy].filter(c => enlaceCobro(c, c.k));
  const sinTel = gMora.length + gHoy.length - cadena.length;

  v.innerHTML = `${avisoHtml()}
    <div class="stats" style="grid-template-columns:repeat(3,1fr)">${tileAv('mora', 'En mora', gMora, gMora.length ? 'alerta' : '')}${tileAv('hoy', 'Cobran hoy', gHoy, '')}${tileAv('prox', 'Próximos ' + DIAS_AVISO + ' días', gProx, '')}</div>
    <p class="mute" style="margin:8px 0">Cartera por cobrar ${money(cartera)} · ${vig.length} vigente(s)${gMora.length + gHoy.length ? '' : ' · Todo al día, nada urgente por cobrar'}</p>
    ${cadena.length ? `<p style="margin:0 0 10px"><button class="sec sm" id="b-cad">Enviar cobros en cadena (${cadena.length}): empieza con ${esc(primerNombre(cadena[0].personas))}</button>${sinTel ? ` <span class="mute" style="font-size:12px">${sinTel} sin teléfono</span>` : ''}</p>` : ''}
    ${(can('prestamos', 'crear') || can('fiados', 'crear')) ? `<details class="card"><summary><b>Nuevo préstamo o crédito</b></summary>
      ${clientes.length ? '' : '<p class="mute">Primero registra al cliente en la pestaña Clientes.</p>'}
      <label>¿Qué vas a registrar?</label><select id="n-tipo">${can('prestamos', 'crear') ? '<option value="prestamo">Préstamo de dinero</option>' : ''}${can('fiados', 'crear') ? '<option value="fiado">Producto a crédito</option>' : ''}</select>
      <label>Cliente</label><input type="hidden" id="n-per" value=""><input id="n-busca" autocomplete="off" enterkeyhint="search" placeholder="Escribe el nombre o la cédula"><div id="n-res" class="res-lista"></div><div id="n-elegido" class="cli-elegido" hidden></div>
      <div id="n-desc-w" hidden><label>Producto que se entrega</label><input id="n-desc" maxlength="200" placeholder="Ej: nevera, celular, mercancía"></div>
      <label id="n-cap-l">Capital prestado ($)</label><input id="n-cap" inputmode="numeric" data-miles placeholder="1.000.000" autocomplete="off">
      <div id="n-tasa-w"><label>Interés mensual (%)</label><input id="n-tasa" inputmode="decimal" value="${tasaDe(can('prestamos', 'crear') ? 'prestamo' : 'fiado')}">
      <p class="mute" style="font-size:12px;margin:4px 0 0">Ya viene con tu tasa habitual, pero puedes cambiarla en cada operación.</p></div>
      <div id="n-fi-w" hidden><label>¿Cómo fijas el precio?</label><select id="n-modo"><option value="precio">Precio final (venta directa)</option><option value="pct">Porcentaje total sobre el valor inicial</option><option value="sin">Sin interés</option></select>
        <div id="n-precio-w"><label>Precio final a crédito ($)</label><input id="n-precio" inputmode="numeric" data-miles placeholder="700.000" autocomplete="off"></div>
        <div id="n-pct-w" hidden><label>Porcentaje total (%)</label><input id="n-pct" inputmode="decimal" placeholder="Ej: 20"><p class="mute" style="font-size:12px;margin:4px 0 0">Es el total de la venta, no se multiplica por los meses.</p></div></div>
      <label>Frecuencia de pago</label><select id="n-fre"><option value="mensual">Mensual</option><option value="quincenal">Quincenal</option><option value="semanal">Semanal</option></select>
      <p class="mute" style="font-size:12px;margin:4px 0 0">Las cuotas se cobran en fechas fijas: semanal, cada sábado; quincenal, el 15 y el 30; mensual, el 30 (en febrero, el último día). La primera cuota es la primera fecha después del préstamo.</p>
      <label>Número de cuotas</label><input id="n-cuo" inputmode="numeric" value="3">
      <label>Fecha de desembolso</label><input id="n-fec" type="date" value="${h}">
      <div class="msg ok" id="n-prev"></div>
      <div id="n-msg"></div>
      <button id="n-go">Crear préstamo</button></details>` : ''}
    <div class="card">
      <div class="row"><select id="f-pres" style="flex:1">${Object.entries(NOMBRES_FILTRO).map(([val, t]) => `<option value="${val}" ${val === filtroPres ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <select id="v-pres" style="flex:0 0 112px"><option value="tabla" ${vistaPres === 'tabla' ? 'selected' : ''}>Tabla</option><option value="tarjetas" ${vistaPres === 'tarjetas' ? 'selected' : ''}>Tarjetas</option></select></div>
      ${can('prestamos', 'exportar') && lista.length ? '<p style="margin:10px 0 0"><button class="sec sm" id="b-rep">Descargar estado de cartera (PDF)</button></p>' : ''}
      <div style="margin-top:8px">${lista.length ? (vistaPres === 'tabla' ? tablaPrestamos(lista) : tarjetasPrestamos(lista)) : '<p class="mute">No hay préstamos en esta vista.</p>'}</div></div>`;

  document.querySelectorAll('.avs').forEach(el => el.onclick = () => { filtroPres = el.dataset.f; vPrestamos(); });
  if ($('#b-cad')) { let ci = 0; $('#b-cad').onclick = () => {
    const c = cadena[ci]; window.open(enlaceCobro(c, c.k), '_blank'); ci++;
    const b = $('#b-cad');
    if (ci < cadena.length) b.textContent = `Enviar al siguiente (${ci + 1} de ${cadena.length}): ${primerNombre(cadena[ci].personas)}`;
    else { b.textContent = `Listo: se abrieron los ${cadena.length} chats`; b.disabled = true; }
  }; }
  $('#f-pres').onchange = e => { filtroPres = e.target.value; vPrestamos(); };
  $('#v-pres').onchange = e => { vistaPres = e.target.value; vPrestamos(); };
  if ($('#b-rep')) $('#b-rep').onclick = () => generar(() => docCartera(lista, NOMBRES_FILTRO[filtroPres]));
  document.querySelectorAll('[data-c]').forEach(el => el.onclick = () => { cuentaSel = el.dataset.c; setAviso(null); vPrestamos(); });

  if ($('#n-go')) {
    const gananciaFi = cap => { const m = $('#n-modo').value; return m === 'precio' ? (entero($('#n-precio').value) || 0) - cap : m === 'pct' ? Math.round(cap * (decimal($('#n-pct').value) || 0) / 100) : 0; };
    const prev = () => {
      if ($('#n-tipo').value === 'fiado') {
        const cap = entero($('#n-cap').value), n = entero($('#n-cuo').value), m = $('#n-modo').value;
        if (!cap || !n || (m === 'precio' && !entero($('#n-precio').value)) || (m === 'pct' && isNaN(decimal($('#n-pct').value)))) { $('#n-prev').innerHTML = 'Escribe el valor inicial, el precio (o porcentaje) y las cuotas para ver el cálculo.'; return; }
        const g = gananciaFi(cap), tot = cap + g;
        $('#n-prev').innerHTML = g < 0 ? 'El precio final no puede ser menor al valor inicial.' : `Precio a crédito: <b>${money(tot)}</b>${m === 'pct' ? ' (' + decimal($('#n-pct').value) + '% total)' : ''}<br>${n} cuotas de <b>${money(Math.round(tot / n))}</b>`;
        return;
      }
      const cap = entero($('#n-cap').value), tasa = decimal($('#n-tasa').value), fre = $('#n-fre').value, n = entero($('#n-cuo').value);
      if (!cap || !n || isNaN(tasa)) { $('#n-prev').innerHTML = 'Escribe capital, tasa y cuotas para ver el cálculo.'; return; }
      const exacto = n / PERIODOS_MES[fre], meses = Math.ceil(exacto), inte = Math.round(cap * tasa / 100 * meses), tot = cap + inte;
      $('#n-prev').innerHTML = `Interés total: <b>${money(inte)}</b> (${tasa}% × ${meses} ${meses === 1 ? 'mes' : 'meses'}${Number.isInteger(exacto) ? '' : ', porque la cuota ' + n + ' cae en el ' + (ORD_MES[meses] || meses + '.º') + ' mes'})<br>Total a pagar: <b>${money(tot)}</b><br>${n} cuotas de <b>${money(Math.round(tot / n))}</b>`;
    };
    ['n-cap', 'n-tasa', 'n-fre', 'n-cuo', 'n-precio', 'n-pct'].forEach(id => $('#' + id).oninput = prev);

    const alTipo = (cambiaTasa) => {
      const f = $('#n-tipo').value === 'fiado';
      $('#n-desc-w').hidden = !f;
      $('#n-cap-l').textContent = f ? 'Valor inicial del producto ($)' : 'Capital prestado ($)';
      $('#n-tasa-w').hidden = f; $('#n-fi-w').hidden = !f;
      $('#n-go').textContent = f ? 'Crear crédito' : 'Crear préstamo';
      if (cambiaTasa) $('#n-tasa').value = tasaDe(f ? 'fiado' : 'prestamo');
      prev();
    };
    $('#n-tipo').onchange = () => alTipo(true);
    alTipo(false);
    $('#n-go').onclick = async () => {
      const per = $('#n-per').value, cap = entero($('#n-cap').value), tasa = decimal($('#n-tasa').value), fre = $('#n-fre').value, cuo = entero($('#n-cuo').value), fec = $('#n-fec').value;
      const tipo = $('#n-tipo').value, desc = $('#n-desc').value.trim();
      const gFi = tipo === 'fiado' ? gananciaFi(cap || 0) : null;
      if (tipo === 'fiado' && cap && $('#n-modo').value === 'precio' && !entero($('#n-precio').value)) { $('#n-msg').innerHTML = '<div class="msg err">Escribe el precio final de la venta.</div>'; return; }
      if (tipo === 'fiado' && cap && $('#n-modo').value === 'pct' && (isNaN(decimal($('#n-pct').value)) || decimal($('#n-pct').value) < 0)) { $('#n-msg').innerHTML = '<div class="msg err">Escribe el porcentaje total.</div>'; return; }
      if (tipo === 'fiado' && gFi < 0) { $('#n-msg').innerHTML = '<div class="msg err">El precio final no puede ser menor al valor inicial.</div>'; return; }
      if (!per || !cap || !cuo || !fec || (tipo !== 'fiado' && isNaN(tasa))) { $('#n-msg').innerHTML = '<div class="msg err">Completa cliente, valor, tasa, cuotas y fecha.</div>'; return; }
      if (tipo === 'fiado' && !desc) { $('#n-msg').innerHTML = '<div class="msg err">Escribe qué producto se entrega.</div>'; return; }
      $('#n-go').disabled = true;
      const { data, error } = await sb.rpc('crear_prestamo', { p_persona: per, p_capital: cap, p_tasa: tipo === 'fiado' ? Math.min(9999, Math.round(gFi / cap * 10000) / 100) : tasa, p_frecuencia: fre, p_cuotas: cuo, p_fecha: fec, p_tipo: tipo, ...(tipo === 'fiado' ? { p_ganancia: gFi } : {}), p_descripcion: tipo === 'fiado' ? desc : null });
      if (error) { $('#n-msg').innerHTML = `<div class="msg err">${esc(error.message)}</div>`; $('#n-go').disabled = false; return; }
      cuentaSel = data; setAviso(tipo === 'fiado' ? 'Crédito creado. Ya puedes descargar su tabla de pagos.' : 'Préstamo creado. Ya puedes descargar su tabla de amortización.', 'ok'); vPrestamos();
    };
  }
}

async function vCuenta() {
  const v = $('#vista');
  v.innerHTML = '<p class="mute">Cargando…</p>';
  const [rc, rp] = await Promise.all([
    sb.from('cuentas').select('*,personas(nombre,cedula,telefono,direccion),cuotas(*)').eq('id', cuentaSel).single(),
    sb.from('pagos').select('*').eq('cuenta_id', cuentaSel).order('consecutivo')
  ]);
  if (rc.error) { cuentaSel = null; setAviso(rc.error.message); return vPrestamos(); }
  const c = rc.data, pagos = rp.data || [], k = calcCuenta(c), per = c.personas || {};
  const vigente = c.estado === 'vigente', h = hoy();
  const estCuota = q => Number(q.pagado) >= Number(q.valor) ? ['Pagada', 'ok'] : c.estado === 'pagado' ? ['Cubierta', 'ok'] : q.fecha_vencimiento < h ? ['Vencida', 'bad'] : Number(q.pagado) > 0 ? ['Parcial', ''] : (k.proxima && k.proxima.numero === q.numero ? ['A pagar', 'ok'] : ['Pendiente', '']);
  const pendProx = k.proxima ? Number(k.proxima.valor) - Number(k.proxima.pagado) : '';
  const verDocs = can('prestamos', 'exportar'), verRec = can('pagos', 'exportar');
  // Enlaces entre el préstamo viejo y el nuevo cuando hubo refinanciación
  let ref = null;
  const idViejo = c.refinancia_a || (c.estado === 'refinanciado' ? c.id : null);
  if (idViejo) {
    const cols = 'id,consecutivo,capital,interes_total,total,tasa_mensual,num_cuotas,frecuencia,estado,fecha_desembolso,capital_refinanciado,refinancia_a';
    const [a, b, d] = await Promise.all([
      sb.from('cuentas').select(cols).eq('id', idViejo).single(),
      sb.from('cuentas').select(cols).eq('refinancia_a', idViejo).neq('estado', 'anulado').maybeSingle(),
      sb.from('pagos').select('*').eq('cuenta_id', idViejo).eq('metodo', 'refinanciación').eq('estado', 'activo').maybeSingle()]);
    if (a.data && b.data && d.data) ref = { viejo: a.data, nuevo: b.data, pago: d.data };
  }
  refActual = ref;
  const capPend = Math.min(k.saldo, Math.round(c.cuotas.reduce((s, q) => s + (Number(q.valor) > 0 ? (Number(q.valor) - Number(q.pagado)) * Number(q.capital_parte) / Number(q.valor) : 0), 0)));
  const puedeRefi = me.es_admin && vigente && k.saldo > 0;
  const sinPagos = !pagos.some(p => p.estado === 'activo');
  const puedeEditar = me.es_admin && vigente && sinPagos && !c.refinancia_a;
  const puedeBorrar = me.es_admin && sinPagos && ['vigente', 'anulado'].includes(c.estado) && !c.refinancia_a && !(ref && ref.viejo.id === c.id);

  v.innerHTML = `${avisoHtml()}
    <p style="margin:0 0 10px"><button class="sec sm" id="back">← Volver</button></p>
    ${ref ? `<div class="card" style="border-left:4px solid var(--brand)"><b>${c.estado === 'refinanciado' ? 'Este préstamo fue refinanciado' : 'Viene de una refinanciación'}</b>
      <p class="mute" style="margin:4px 0 8px">${c.estado === 'refinanciado'
        ? 'Se canceló con todo lo que debía (' + money(ref.pago.monto) + ') y se abrió el préstamo #' + pad(ref.nuevo.consecutivo) + ' por ' + money(ref.nuevo.capital) + '. Al cliente se le entregaron ' + money(Math.max(0, Number(ref.nuevo.capital) - Number(ref.pago.monto))) + '.'
        : 'Reemplaza al préstamo #' + pad(ref.viejo.consecutivo) + ', que se canceló con ' + money(ref.pago.monto) + '. Al cliente se le entregaron ' + money(Math.max(0, Number(c.capital) - Number(ref.pago.monto))) + '.'}</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px"><button class="sec sm" data-ir="${c.estado === 'refinanciado' ? ref.nuevo.id : ref.viejo.id}">Ver el préstamo #${pad(c.estado === 'refinanciado' ? ref.nuevo.consecutivo : ref.viejo.consecutivo)}</button>
      ${me.es_admin && c.estado === 'vigente' && c.refinancia_a && !pagos.some(p => p.estado === 'activo') ? '<button class="bad sm" id="b-deshacer">Deshacer refinanciación</button>' : ''}</div></div>` : ''}
    <div class="card">
      <div class="row"><h2 style="margin:0">#${pad(c.consecutivo)} · ${esc(per.nombre || '—')}</h2>${tagHtml(estadoCuenta(c, k))}</div>
      <div class="mute">CC ${esc(per.cedula || '')}${per.telefono ? ' · ' + esc(per.telefono) : ''}</div>
      ${c.tipo === 'fiado' ? `<div class="mute">Producto a crédito${c.descripcion ? ': ' + esc(c.descripcion) : ''}</div>` : ''}
      <table class="matrix" style="margin-top:10px">
        <tr><td>${c.tipo === 'fiado' ? 'Valor del producto' : 'Capital'}</td><td style="text-align:right">${money(c.capital)}</td></tr>
        <tr><td>${c.tipo === 'fiado' ? 'Ganancia de la venta' : 'Interés (' + Number(c.tasa_mensual) + '% × ' + mesesTxt(mesesDe(c)) + ')'}</td><td style="text-align:right">${money(c.interes_total)}</td></tr>
        <tr><td>Total a pagar</td><td style="text-align:right"><b>${money(c.total)}</b></td></tr>
        <tr><td>Pagado</td><td style="text-align:right">${money(k.pagado)}</td></tr>
        ${Number(c.descuento) > 0 ? `<tr><td>Descuento</td><td style="text-align:right">${money(c.descuento)}</td></tr>` : ''}
        <tr><td><b>Saldo pendiente</b></td><td style="text-align:right"><b>${money(k.saldo)}</b></td></tr>
        ${(() => { const a = cuotaAPagar(k, c); return a ? `<tr><td>${a.vencida ? 'Cuota vencida a pagar' : 'Cuota a pagar'}</td><td style="text-align:right"><b class="${a.vencida ? 'bad-t' : ''}">${money(a.valor)}</b><br><span class="mute">${a.vencida ? 'vencida desde' : 'vence'} ${fdate(a.fecha)}</span></td></tr>` : c.estado === 'pagado' ? '<tr><td>Estado</td><td style="text-align:right"><b>Paz y salvo</b></td></tr>' : ''; })()}
      </table>
      <p class="mute" style="margin:8px 0 0">${c.num_cuotas} cuotas ${FREQ[c.frecuencia].toLowerCase()}es · desembolso ${fdate(c.fecha_desembolso)}${c.estado === 'anulado' ? ` · Anulado: ${esc(c.motivo_anulacion)}` : ''}</p>
      ${c.descuento_motivo ? `<p class="mute" style="margin:4px 0 0">Descuento: ${esc(c.descuento_motivo)}</p>` : ''}
    </div>

    ${vigente && can('pagos', 'crear') ? `<div class="card"><h2>Registrar pago</h2>
      <label>Valor ($)</label><input id="pg-monto" inputmode="numeric" data-miles value="${milesTxt(pendProx)}">
      <label>Fecha</label><input id="pg-fecha" type="date" value="${h}">
      <label>Forma de pago</label><select id="pg-met"><option>efectivo</option><option>transferencia</option><option>otro</option></select>
      <label>Nota (opcional)</label><input id="pg-nota">
      <div id="pg-msg"></div>
      <div style="margin-top:12px"><button id="pg-go">Registrar pago</button></div></div>` : ''}

    <div class="card"><h2>Cuotas</h2>
      <table class="matrix"><thead><tr><th>#</th><th>Vence</th><th>Cuota</th><th>Pagado</th><th></th></tr></thead><tbody>
      ${k.cu.map(q => `<tr><td>${q.numero}</td><td>${fdate(q.fecha_vencimiento)}</td><td>${money(q.valor)}</td><td>${money(q.pagado)}</td><td>${tagHtml(estCuota(q))}</td></tr>`).join('')}
      </tbody></table></div>

    <div class="card"><h2>Pagos</h2>
      ${pagos.length ? pagos.map(p => `<div class="item ${p.estado === 'anulado' ? 'off' : ''}">
        <div class="row"><div><b>Recibo #${pad(p.consecutivo)}</b> · ${money(p.monto)}${p.estado === 'anulado' ? '<span class="tag">anulado</span>' : ''}</div>
          <div>${p.estado === 'activo' && verRec && p.metodo !== 'refinanciación' ? `<button class="sec sm" data-rec="${p.id}">Recibo PDF</button> ` : ''}${p.estado === 'activo' && can('pagos', 'anular') && p.metodo !== 'refinanciación' ? `<button class="sec sm" data-anpago="${p.id}">Anular</button>` : ''}</div></div>
        <div class="mute">${fdate(p.fecha)} · ${esc(p.metodo)}${p.nota ? ' · ' + esc(p.nota) : ''}${p.estado === 'anulado' ? ' · Motivo: ' + esc(p.motivo_anulacion) : ''}</div></div>`).join('') : '<p class="mute">Sin pagos registrados.</p>'}</div>

    ${verDocs && c.estado !== 'anulado' ? `<div class="card"><h2>Documentos</h2>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <button data-doc="amort">Tabla de pagos</button>
        ${vigente ? '<button data-doc="cobro">Nota de cobro</button>' : ''}
        ${ref ? '<button data-doc="refi">Documento de refinanciación</button>' : ''}
        ${c.estado === 'pagado' ? '<button data-doc="paz">Paz y salvo</button>' : ''}
      </div></div>` : ''}

    ${verDocs && c.estado !== 'anulado' ? `<div class="card"><h2>Enviar al cliente por WhatsApp</h2>
      <p class="mute" style="margin-top:0;font-size:13px">Abre directo el chat de este cliente con el mensaje ya escrito, con su información. ${per.telefono ? 'Teléfono del cliente: ' + esc(per.telefono) + '.' : '<b>Este cliente no tiene teléfono registrado.</b>'}</p>
      <label>¿Qué le envías?</label><select id="wa-doc">
        ${vigente ? '<option value="cobro">' + (k.mora ? 'Nota de cobro (cuotas vencidas)' : 'Recordatorio de próxima cuota') + '</option>' : ''}
        ${c.estado === 'pagado' ? '<option value="paz">Paz y salvo</option>' : ''}
        <option value="amort">Tabla de pagos</option>
        ${ref ? '<option value="refi">Documento de refinanciación</option>' : ''}
        ${pagos.some(p => p.estado === 'activo' && p.metodo !== 'refinanciación') ? '<option value="recibo">Recibo del último pago</option>' : ''}</select>
      <label>Mensaje (puedes corregirlo antes de enviar)</label>
      <textarea id="wa-txt" rows="10"></textarea>
      <div id="wa-msg"></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"><button id="wa-go">Enviar por WhatsApp</button></div></div>` : ''}

    ${puedeRefi ? `<details class="card" id="refi"><summary><b>Refinanciar este préstamo</b></summary>
      <p class="mute" style="font-size:13px">Se cancela <b>todo</b> lo que el cliente debe hoy (capital, intereses y lo vencido) y se abre un préstamo nuevo. Al cliente solo se le entrega la diferencia.</p>
      <table class="matrix refi-tab">
        <tr><td>Capital pendiente</td><td style="text-align:right">${money(capPend)}</td></tr>
        <tr><td>Intereses pendientes</td><td style="text-align:right">${money(k.saldo - capPend)}</td></tr>
        ${k.mora ? `<tr><td class="mute">Incluye vencido (${k.atrasadas.length} cuota(s))</td><td style="text-align:right" class="mute">${money(k.vencido)}</td></tr>` : ''}
        <tr><td><b>Total a cancelar</b></td><td style="text-align:right"><b>${money(k.saldo)}</b></td></tr>
      </table>
      <label>Valor del préstamo nuevo ($)</label><input id="rf-cap" inputmode="numeric" data-miles value="${milesTxt(Math.max(k.saldo, Number(c.capital)))}">
      <label>Interés mensual (%)</label><input id="rf-tasa" inputmode="decimal" value="${tasaDe(c.tipo)}">
      <label>Frecuencia</label><select id="rf-fre"><option value="semanal" ${c.frecuencia === 'semanal' ? 'selected' : ''}>Semanal</option><option value="quincenal" ${c.frecuencia === 'quincenal' ? 'selected' : ''}>Quincenal</option><option value="mensual" ${c.frecuencia === 'mensual' ? 'selected' : ''}>Mensual</option></select>
      <label>Número de cuotas</label><input id="rf-cuo" inputmode="numeric" value="${c.num_cuotas}">
      <label>Fecha</label><input id="rf-fec" type="date" value="${h}">
      <div id="rf-prev" class="refi-giro"></div>
      <div id="rf-msg"></div>
      <div style="margin-top:12px"><button id="rf-go">Refinanciar</button></div></details>` : ''}

    ${puedeEditar ? `<details class="card" id="corr"><summary><b>Corregir un error</b> <span class="mute" style="font-size:13px">(solo administrador)</span></summary>
      ${puedeEditar ? `<p class="mute" style="font-size:13px">Puedes cambiar los datos mientras el préstamo no tenga pagos. Las cuotas se recalculan y el número de referencia se conserva.</p>
      ${c.tipo === 'fiado' ? '<label>Producto</label><input id="ed-desc" value="' + esc(c.descripcion || '') + '">' : ''}
      <label>${c.tipo === 'fiado' ? 'Valor del producto' : 'Valor del préstamo'} ($)</label><input id="ed-cap" inputmode="numeric" data-miles value="${milesTxt(Number(c.capital))}">
      ${c.tipo === 'fiado' ? '<label>Precio final a crédito ($)</label><input id="ed-precio" inputmode="numeric" data-miles value="' + milesTxt(Number(c.total)) + '" autocomplete="off">' : '<label>Interés mensual (%)</label><input id="ed-tasa" inputmode="decimal" value="' + Number(c.tasa_mensual) + '">'}
      <label>Frecuencia</label><select id="ed-fre">${['semanal', 'quincenal', 'mensual'].map(f => '<option value="' + f + '"' + (c.frecuencia === f ? ' selected' : '') + '>' + f.charAt(0).toUpperCase() + f.slice(1) + '</option>').join('')}</select>
      <label>Número de cuotas</label><input id="ed-cuo" inputmode="numeric" value="${c.num_cuotas}">
      <label>Fecha de desembolso</label><input id="ed-fec" type="date" value="${c.fecha_desembolso}">
      <div class="msg ok" id="ed-prev"></div><div id="ed-msg"></div>
      <button id="ed-go">Guardar cambios</button>` : ''}
    </details>` : ''}

    ${me.es_admin && c.estado !== 'refinanciado' ? `<div class="card" id="elim"><h2>Eliminar este préstamo</h2>
      ${puedeBorrar ? `<p class="mute" style="font-size:13px;margin-top:0">Se borra por completo, con sus cuotas. Solo es posible porque no tiene pagos. Queda en el registro de auditoría.</p><button class="bad" id="b-borrar">Eliminar este préstamo</button>`
      : `<p class="mute" style="font-size:13px;margin:0">No se puede eliminar: ${c.refinancia_a || (ref && ref.viejo.id === c.id) ? 'está enlazado a una refinanciación. Si fue un error, usa «Deshacer refinanciación».' : !sinPagos ? 'ya tiene pagos registrados. Si fue un error, anula primero esos pagos.' : 'este préstamo ya no está vigente.'}</p>`}
    </div>` : ''}

    ${vigente && (me.es_admin || can('prestamos', 'anular')) ? `<div class="card"><h2>Administración</h2>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${me.es_admin ? '<button class="sec" id="b-desc">Aplicar descuento</button>' : ''}
        ${can('prestamos', 'anular') ? '<button class="bad" id="b-anular">Anular préstamo</button>' : ''}
      </div></div>` : ''}`;

  $('#back').onclick = () => { cuentaSel = null; setAviso(null); vPrestamos(); };
  const fin = (error, ok) => { setAviso(error ? error.message : ok, error ? 'err' : 'ok'); vCuenta(); };

  if ($('#pg-go')) $('#pg-go').onclick = async () => {
    const monto = entero($('#pg-monto').value);
    if (!monto) { alertaEn('pg-msg', 'Escribe el valor del pago.'); return; }
    if (!confirm(`¿Registrar un pago de ${money(monto)} de ${per.nombre}?`)) return;
    $('#pg-go').disabled = true;
    const { error } = await sb.rpc('registrar_pago', { p_cuenta: c.id, p_monto: monto, p_fecha: $('#pg-fecha').value || h, p_metodo: $('#pg-met').value, p_nota: $('#pg-nota').value.trim() || null });
    if (error) { alertaEn('pg-msg', error.message); $('#pg-go').disabled = false; return; }
    fin(null, 'Pago registrado. Ya puedes descargar el recibo.');
  };
  document.querySelectorAll('[data-anpago]').forEach(b => b.onclick = async () => {
    const motivo = (prompt('Motivo de la anulación del pago:') || '').trim();
    if (!motivo) return;
    b.disabled = true;
    const { error } = await sb.rpc('anular_pago', { p_pago: b.dataset.anpago, p_motivo: motivo });
    fin(error, 'Pago anulado.');
  });
  if ($('#b-desc')) $('#b-desc').onclick = async () => {
    const sug = c.cuotas.filter(q => q.fecha_vencimiento > h && Number(q.pagado) === 0).reduce((s, q) => s + Number(q.interes_parte), 0);
    const m = entero(prompt(`Valor del descuento.\nSugerido: ${money(sug)} (intereses de las cuotas que aún no vencen).\nMáximo: ${money(k.saldo)}`, String(sug || '')));
    if (!m) return;
    const motivo = (prompt('Motivo del descuento (queda registrado):') || '').trim();
    if (!motivo) return;
    $('#b-desc').disabled = true;
    const { error } = await sb.rpc('aplicar_descuento', { p_cuenta: c.id, p_monto: m, p_motivo: motivo });
    fin(error, 'Descuento aplicado.');
  };
  if ($('#b-anular')) $('#b-anular').onclick = async () => {
    const motivo = (prompt('Motivo de la anulación del préstamo:') || '').trim();
    if (!motivo) return;
    $('#b-anular').disabled = true;
    const { error } = await sb.rpc('anular_prestamo', { p_cuenta: c.id, p_motivo: motivo });
    fin(error, 'Préstamo anulado.');
  };
  document.querySelectorAll('[data-doc]').forEach(b => b.onclick = () => generar(() =>
    ({ amort: docAmortizacion, cobro: docCobro, paz: docPazYSalvo, refi: () => docRefinanciacion(ref, per) })[b.dataset.doc](c, k, per, pagos)));
  document.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => generar(() =>
    docRecibo(c, k, per, pagos.find(p => p.id === b.dataset.rec))));
  if ($('#ed-go')) {
    const calcEd = () => {
      const cap = entero($('#ed-cap').value), fre = $('#ed-fre').value, n = entero($('#ed-cuo').value);
      if (c.tipo === 'fiado') {
        const precio = entero($('#ed-precio').value);
        if (!cap || !n || !precio || precio < cap) return null;
        return { cap, tasa: Math.min(9999, Math.round((precio - cap) / cap * 10000) / 100), fre, n, inte: precio - cap, tot: precio, g: precio - cap, fi: true };
      }
      const tasa = decimal($('#ed-tasa').value);
      if (!cap || !n || isNaN(tasa)) return null;
      const { meses, inte } = interesMes(cap, tasa, fre, n);
      return { cap, tasa, fre, n, meses, inte, tot: cap + inte };
    };
    const prevEd = () => { const r = calcEd(); $('#ed-prev').innerHTML = r && r.fi ? 'Precio a crédito <b>' + money(r.tot) + '</b> · ' + r.n + ' cuotas de <b>' + money(Math.round(r.tot / r.n)) + '</b>' : r ? 'Interés ' + money(r.inte) + ' (' + r.tasa + '% × ' + mesesTxt(r.meses) + ') · Total <b>' + money(r.tot) + '</b> · ' + r.n + ' cuotas de <b>' + money(Math.round(r.tot / r.n)) + '</b>' : 'Completa los datos para ver el cálculo.'; };
    ['ed-cap', 'ed-tasa', 'ed-precio', 'ed-fre', 'ed-cuo'].forEach(id => { if ($('#' + id)) $('#' + id).oninput = prevEd; }); prevEd();
    $('#ed-go').onclick = async () => {
      const r = calcEd(); if (!r || !$('#ed-fec').value) { $('#ed-msg').innerHTML = '<div class="msg err">Completa todos los datos.</div>'; return; }
      if (!confirm('¿Guardar los cambios? Las cuotas se van a recalcular.')) return;
      $('#ed-go').disabled = true;
      const { error } = await sb.rpc('editar_prestamo', { p_cuenta: c.id, p_capital: r.cap, p_tasa: r.tasa, p_frecuencia: r.fre, p_cuotas: r.n, p_fecha: $('#ed-fec').value, p_descripcion: $('#ed-desc') ? $('#ed-desc').value.trim() : null, ...(r.fi ? { p_ganancia: r.g } : {}) });
      if (error) { $('#ed-msg').innerHTML = '<div class="msg err">' + esc(error.message) + '</div>'; $('#ed-go').disabled = false; return; }
      fin(null, 'Préstamo corregido.');
    };
  }
  if ($('#b-borrar')) $('#b-borrar').onclick = async () => {
    if (!confirm('¿Eliminar el préstamo ' + pad(c.consecutivo) + ' de ' + per.nombre + '? Esta acción no se puede deshacer.')) return;
    $('#b-borrar').disabled = true;
    const { error } = await sb.rpc('eliminar_prestamo', { p_cuenta: c.id });
    if (error) { setAviso(error.message); return vCuenta(); }
    cuentaSel = null; setAviso('Préstamo eliminado.', 'ok'); vPrestamos();
  };
  document.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => { cuentaSel = b.dataset.ir; setAviso(null); vPrestamos(); });
  if ($('#b-deshacer')) $('#b-deshacer').onclick = async () => {
    const motivo = (prompt('Motivo para deshacer la refinanciación (el préstamo anterior vuelve a quedar vigente):') || '').trim();
    if (!motivo) return;
    $('#b-deshacer').disabled = true;
    const { error } = await sb.rpc('deshacer_refinanciacion', { p_nueva: c.id, p_motivo: motivo });
    if (!error) cuentaSel = ref.viejo.id;
    fin(error, 'Refinanciación deshecha. El préstamo anterior volvió a quedar vigente.');
  };
  if ($('#rf-go')) {
    const calc = () => {
      const cap = entero($('#rf-cap').value), tasa = decimal($('#rf-tasa').value), fre = $('#rf-fre').value, n = entero($('#rf-cuo').value);
      if (!cap || !n || isNaN(tasa)) return null;
      const { meses, inte } = interesMes(cap, tasa, fre, n), tot = cap + inte;
      return { cap, tasa, fre, n, meses, inte, tot, giro: cap - k.saldo };
    };
    const prevRf = () => {
      const r = calc(), box = $('#rf-prev');
      if (!r) { box.innerHTML = 'Escribe el valor, la tasa y las cuotas para ver el cálculo.'; $('#rf-go').disabled = true; return; }
      if (r.cap < k.saldo) { box.innerHTML = '<b class="bad-t">El valor nuevo debe ser al menos lo que debe el cliente (' + money(k.saldo) + ').</b>'; $('#rf-go').disabled = true; return; }
      $('#rf-go').disabled = false;

    $('#wa-doc').onchange = llena; llena();

  }
}

async function enviarWa(tipo, c, k, per, pagos, texto) {

function letras(n) {
  n = Math.floor(Math.abs(n));
  if (n === 0) return 'cero';
  if (n >= 1e9) return String(n);
  const U = ['', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés', 'veinticuatro', 'veinticinco', 'veintiséis', 'veintisiete', 'veintiocho', 'veintinueve'];
  const D = ['', '', '', 'treinta', 'cuarenta', 'cincuenta', 'sesenta', 'setenta', 'ochenta', 'noventa'];
  const C = ['', 'ciento', 'doscientos', 'trescientos', 'cuatrocientos', 'quinientos', 'seiscientos', 'setecientos', 'ochocientos', 'novecientos'];
  const apoc = s => s.replace(/veintiuno$/, 'veintiún').replace(/uno$/, 'un');
  const m1000 = x => {
    if (x === 100) return 'cien';
    const c = Math.floor(x / 100), r = x % 100;
    let s = c ? C[c] + (r ? ' ' : '') : '';
    if (r < 30) s += U[r]; else { const d = Math.floor(r / 10), u = r % 10; s += D[d] + (u ? ' y ' + U[u] : ''); }
    return s;
  };
  const mill = Math.floor(n / 1e6), mil = Math.floor((n % 1e6) / 1e3), resto = n % 1e3, out = [];
  if (mill) out.push(mill === 1 ? 'un millón' : apoc(m1000(mill)) + ' millones');
  if (mil) out.push(mil === 1 ? 'mil' : apoc(m1000(mil)) + ' mil');
  if (resto) out.push(m1000(resto));
  return out.join(' ');
}
const enLetras = n => { const t = letras(n); return t.charAt(0).toUpperCase() + t.slice(1) + (Math.floor(n) % 1e6 === 0 && n >= 1e6 ? ' de pesos' : ' pesos'); };

function nuevoDoc(titulo) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'letter' });
  doc.setTextColor(0);
  let altoLogo = 0;
  if (negocio.logo) {
    try {
      const r = Math.min(38 / negocio.logo_w, 20 / negocio.logo_h), lw = negocio.logo_w * r, lh = negocio.logo_h * r;
      doc.addImage(negocio.logo, /^data:image\/png/.test(negocio.logo) ? 'PNG' : 'JPEG', 15, 10, lw, lh);
      altoLogo = lh;
    } catch (e) { altoLogo = 0; }
  }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text(negocio.nombre || '', 108, 18, { align: 'center' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
  const lin = [];
  lin.forEach((t, i) => doc.text(t, 108, 24 + i * 4.5, { align: 'center' }));
  const y = Math.max(24 + lin.length * 4.5 + 3, altoLogo ? 10 + altoLogo + 4 : 0);
  doc.setDrawColor(20, 83, 45); doc.setLineWidth(0.6); doc.line(15, y, 201, y);

  return { doc, y: y + 18 };
}
const kv = (doc, y, pares) => {
  pares.forEach(([clave, val]) => {
    doc.setFont('helvetica', 'bold'); doc.text(clave + ':', 15, y);
    doc.setFont('helvetica', 'normal');
    const l = doc.splitTextToSize(String(val), 135); doc.text(l, 62, y); y += 5.8 * l.length;
  });
  return y + 2;
};
const parrafo = (doc, y, t) => { const l = doc.splitTextToSize(t, 186); doc.text(l, 15, y); return y + 5.5 * l.length + 3; };
const negrita = (doc, y, t) => { doc.setFont('helvetica', 'bold'); doc.text(t, 15, y); doc.setFont('helvetica', 'normal'); return y + 6; };
const tablaEstilo = { styles: { fontSize: 9, halign: 'right' }, headStyles: { fillColor: [20, 83, 45], halign: 'right' }, footStyles: { fillColor: [230, 238, 233], textColor: 0 }, margin: { left: 15, right: 15 } };

function firmaYGuardar(doc, y, archivo) { guardarPie(doc, archivo); }
function guardarPie(doc, archivo) {
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120);
    doc.text(`Documento generado el ${new Date().toLocaleString('es-CO')} · ${negocio.nombre || ''}`, 108, 272, { align: 'center' });
  }
  if (capturaPdf) { capturaPdf.blob = doc.output('blob'); capturaPdf.nombre = archivo; return; }
  doc.save(archivo);
}

let logoSel = { logo: '', w: 0, h: 0 }, qrSel = { logo: '', w: 0, h: 0 };
function leerLogo(file, cuadrado) {
  return new Promise((ok, mal) => {
    if (!file || !/^image\/(png|jpe?g|webp|gif)$/.test(file.type)) return mal(new Error('Elige una imagen PNG o JPG.'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('No se pudo leer esa imagen.')); };
    img.onload = () => {
      URL.revokeObjectURL(url);
      const png = /png|gif|webp/.test(file.type);
      for (const max of cuadrado ? [320, 240, 180] : [420, 300, 200]) {
        const r = Math.min(1, max / img.width, (cuadrado ? max : max * 0.45) / img.height), w = Math.max(1, Math.round(img.width * r)), hh = Math.max(1, Math.round(img.height * r));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
        const cx = cv.getContext('2d');
        if (!png) { cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, hh); }
        cx.drawImage(img, 0, 0, w, hh);
        const d = png ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.85);
        if (d.length < 200000) return ok({ logo: d, w, h: hh });
      }

let vistaEst = 'graf', estDatos = null;
const MES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const mesCorto = m => MES_C[Number(m.slice(5, 7)) - 1];
const mesLargo = m => MES_L[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(0, 4);
const num = n => Number(n || 0);
const pct = (a, b) => b > 0 ? Math.round(a * 100 / b) : 0;
function compacto(n) {
  n = num(n); const a = Math.abs(n);
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.', ',').replace(',0', '') + ' M';
  if (a >= 1e3) return Math.round(n / 1e3) + ' mil';
  return String(Math.round(n));
}
const dineroC = n => '$' + compacto(n);
function hace(dias) {
  dias = num(dias);
  if (dias < 1) return 'hoy';
  if (dias < 45) return `hace ${dias} día${dias === 1 ? '' : 's'}`;
  if (dias < 730) { const m = Math.round(dias / 30.4); return `hace ${m} meses`; }
  const a = Math.floor(dias / 365), m = Math.round((dias - a * 365) / 30.4);
  return `hace ${a} año${a === 1 ? "" : "s"}` + (m > 0 && m < 12 ? ` y ${m} mes${m === 1 ? '' : 'es'}` : '');
}
function ticks(max) {
  if (max <= 0) return [0, 1];
  const p = Math.pow(10, Math.floor(Math.log10(max / 3)));
  const paso = [1, 2, 5, 10].map(f => f * p).find(s => max / s <= 4) || 10 * p;
  const t = []; for (let v = 0; v <= max + paso * 0.001; v += paso) t.push(v);
  if (t[t.length - 1] < max) t.push(t[t.length - 1] + paso);
  return t;
}
// Barra con el extremo superior redondeado (4px) y la base recta
function barraPath(x, y, w, h, redondear) {
  const r = redondear ? Math.min(4, w / 2, h) : 0;
  return `M${x},${y + h}V${y + r}${r ? `Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}` : `H${x + w}`}V${y + h}Z`;
}
// Gráfico de columnas (apiladas o simples). series: [{k, nombre, color}]
function columnas(id, filas, series, opts = {}) {
  const W = 340, H = 180, pl = 46, pr = 6, pt = 10, pb = 24, iw = W - pl - pr, ih = H - pt - pb;
  const tot = f => series.reduce((s, x) => s + num(f[x.k]), 0);
  const tk = ticks(Math.max(...filas.map(tot), 0));
  const top = tk[tk.length - 1] || 1;
  const slot = iw / filas.length, bw = Math.min(24, slot - 6);
  const Y = v => pt + ih - (v / top) * ih;
  let g = tk.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}" class="v-grid"/><text x="${pl - 5}" y="${Y(t) + 3.5}" text-anchor="end" class="v-eje">${opts.dinero === false ? compacto(t) : compacto(t)}</text>`).join('');
  filas.forEach((f, i) => {
    const cx = pl + slot * i + slot / 2, x = cx - bw / 2;
    let acum = 0;
    const vis = series.filter(s => num(f[s.k]) > 0);
    vis.forEach((s, j) => {
      const v = num(f[s.k]), y0 = Y(acum + v), h = Math.max(Y(acum) - y0 - (vis.length > 1 && j < vis.length - 1 ? 0 : 0), 0);
      const gap = j > 0 ? 2 : 0;           // 2px de superficie entre segmentos apilados
      const yy = y0, hh = Math.max(h - gap, 1);
      g += `<path d="${barraPath(x, yy, bw, hh, j === vis.length - 1)}" class="v-barra" style="fill:var(${s.color})" data-i="${i}"/>`;
      acum += v;
    });
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" class="v-eje">${mesCorto(f.mes)}</text>`;
    g += `<rect x="${pl + slot * i}" y="${pt}" width="${slot}" height="${ih + pb}" class="v-hit" data-g="${id}" data-i="${i}" tabindex="0" role="img" aria-label="${mesLargo(f.mes)}: ${series.map(s => s.nombre + ' ' + (opts.fmt || money)(f[s.k])).join(', ')}"/>`;
  });
  g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(0)}" y2="${Y(0)}" class="v-base"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="v-svg" id="${id}" role="group">${g}</svg>`;
}
const leyenda = series => `<div class="v-ley">${series.map(s => `<span><i style="background:var(${s.color})"></i>${s.nombre}</span>`).join('')}</div>`;
function barrasH(filas, color, fmt = money) {
  const max = Math.max(...filas.map(f => num(f.v)), 1);
  return filas.map(f => `<div class="v-fila"><div class="v-et">${esc(f.et)}</div><div class="v-pista"><div class="v-rel" style="width:${Math.max(num(f.v) / max * 100, num(f.v) > 0 ? 1.5 : 0)}%;background:var(${f.color || color})"></div></div><div class="v-val">${esc(fmt(f.v))}${f.sub ? `<small>${esc(f.sub)}</small>` : ''}</div></div>`).join('');
}

// Tooltip: lista todas las series de la columna; el texto entra con textContent
function activarTips(mapa) {
  const tip = $('#v-tip'); if (!tip) return;
  const cont = tip.parentElement;
  const ocultar = () => { tip.hidden = true; document.querySelectorAll('.v-barra.on').forEach(b => b.classList.remove('on')); };
  const mostrar = el => {
    const [filas, series, fmt] = mapa[el.dataset.g], f = filas[Number(el.dataset.i)];
    tip.textContent = '';
    const t = document.createElement('div'); t.className = 'v-tt'; t.textContent = mesLargo(f.mes); tip.appendChild(t);
    series.forEach(s => {
      const row = document.createElement('div'); row.className = 'v-tr';
      const k = document.createElement('i'); k.style.background = `var(${s.color})`;
      const val = document.createElement('b'); val.textContent = fmt(f[s.k]);
      const nom = document.createElement('span'); nom.textContent = s.nombre;
      row.append(k, val, nom); tip.appendChild(row);
    });
    document.querySelectorAll('.v-barra.on').forEach(b => b.classList.remove('on'));
    el.parentNode.querySelectorAll(`.v-barra[data-i="${el.dataset.i}"]`).forEach(b => b.classList.add('on'));
    tip.hidden = false;
    const c = cont.getBoundingClientRect(), r = el.getBoundingClientRect(), w = tip.offsetWidth;
    let x = r.left - c.left + r.width / 2 - w / 2; x = Math.max(4, Math.min(x, c.width - w - 4));
    tip.style.left = x + 'px'; tip.style.top = (r.top - c.top - tip.offsetHeight - 6) + 'px';
  };
  document.querySelectorAll('.v-hit').forEach(el => {
    el.addEventListener('pointerenter', () => mostrar(el));
    el.addEventListener('pointermove', () => mostrar(el));
    el.addEventListener('pointerleave', ocultar);
    el.addEventListener('focus', () => mostrar(el));
    el.addEventListener('blur', ocultar);
  });
}

/* ---------------- AVISOS DE COBRO (dentro de Préstamos) ---------------- */
let alertasCache = null;
const DIAS_AVISO = 3;
async function datosAlertas() {
  const { data, error } = await sb.from('cuentas').select('*,personas(nombre,cedula,telefono),cuotas(numero,fecha_vencimiento,valor,pagado)').eq('estado', 'vigente').limit(1000);
  if (error) throw new Error(error.message);
  const h = hoy(), mora = [], hoyL = [], prox = [];
  (data || []).forEach(c => {
    const k = calcCuenta(c);
    if (k.mora) { mora.push({ c, k, valor: k.vencido, dias: k.diasMora }); return; }
    const pend = k.cu.filter(q => Number(q.pagado) < Number(q.valor));
    const dHoy = pend.filter(q => q.fecha_vencimiento === h);
    if (dHoy.length) { hoyL.push({ c, k, valor: dHoy.reduce((s, q) => s + Number(q.valor) - Number(q.pagado), 0), fecha: h }); return; }
    const q = pend.find(x => diasEntre(h, x.fecha_vencimiento) >= 1 && diasEntre(h, x.fecha_vencimiento) <= DIAS_AVISO);
    if (q) prox.push({ c, k, valor: Number(q.valor) - Number(q.pagado), fecha: q.fecha_vencimiento });
  });
  mora.sort((a, b) => b.dias - a.dias); prox.sort((a, b) => a.fecha.localeCompare(b.fecha));
  alertasCache = { t: Date.now(), n: mora.length + hoyL.length, mora, hoy: hoyL, prox };
  return alertasCache;
}
async function badgeAlertas() {
  if (!can('prestamos', 'ver')) return;
  try {
    const a = alertasCache && Date.now() - alertasCache.t < 60000 ? alertasCache : await datosAlertas();
    const b = document.querySelector('nav button[data-t="prestamos"]');
    if (b && a.n > 0) { b.textContent = TAB_NOMBRE.prestamos + ' '; const s = document.createElement('span'); s.className = 'badge'; s.textContent = a.n; b.appendChild(s); }
  } catch (e) { /* el aviso es opcional */ }
}
const telWa = t => { const d = String(t || '').replace(/\D/g, ''); return d.length === 10 ? '57' + d : d; };
// Enlace directo al chat del cliente, con el mensaje de cobro ya escrito
function enlaceCobro(c, k) {
  const per = c.personas || {}, t = telWa(per.telefono), msg = msgCobro(c, k, per);
  return t && msg ? `https://wa.me/${t}?text=${encodeURIComponent(msg)}` : '';
}
// Urgencia para ordenar: 0 mora · 1 cobra hoy · 2 próximos días · 3 al día · 4 pagado · 5 refinanciado · 6 anulado
function urgenciaDe(c, k) {
  if (c.estado === 'anulado') return 6;
  if (c.estado === 'refinanciado') return 5;
  if (c.estado === 'pagado') return 4;
  if (k.mora) return 0;
  const h = hoy(), pend = k.cu.filter(q => Number(q.pagado) < Number(q.valor));
  if (pend.some(q => q.fecha_vencimiento === h)) return 1;
  if (pend.some(q => { const d = diasEntre(h, q.fecha_vencimiento); return d >= 1 && d <= DIAS_AVISO; })) return 2;
  return 3;
}
