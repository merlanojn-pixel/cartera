<style>

input[type=file]{padding:10px}

<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script>
// ======== CONFIGURACIÓN (pegar los datos del proyecto Supabase de esta instalación) ========
const SUPABASE_URL = 'https://xyjzsxrordwztizhuizm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5anpzeHJvcmR3enRpemh1aXptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MTAzMjksImV4cCI6MjEwNzM4NjMyOX0.e9mG5xKU2wQrfgfJp8_xoFR4ZJmkwcznAnGaSuv7a5w';
// Nombre de la plataforma (lo que ve cualquiera antes de entrar). 
const NOMBRE_PLATAFORMA = 'CAPITALIA';
const NOMBRE_NEGOCIO = 'Mi negocio'; // solo mientras carga; el nombre real viene de cada negocio
const MAX_INTENTOS = 5, MIN_BLOQUEO = 15; // deben coincidir con 04_acceso.sql
// ============================================================================================

const MODULOS = [['personas','Clientes'],['prestamos','Préstamos'],['fiados','Fiados'],['pagos','Pagos'],['caja','Caja'],['reportes','Estadísticas']];
const ACCIONES = ['ver','crear','editar','anular','exportar'];
const limpiarUsuario = s => String(s || '').trim().toLowerCase().replace(/\s+/g, '');
// La cuenta se escribe usuario@código-del-negocio (ej: maria@inversionesvitola)
const partirCuenta = s => { const t = limpiarUsuario(s), i = t.lastIndexOf('@'); return i < 1 ? null : { usuario: t.slice(0, i), codigo: t.slice(i + 1) }; };
const tasaDe = tipo => { const v = tipo === 'fiado' ? negocio.tasa_credito : negocio.tasa_prestamo; return v == null || v === '' ? (tipo === 'fiado' ? 10 : 20) : v; };
const cuentaDe = u => (u && u.usuario ? u.usuario + '@' + (negocio.codigo || '') : '');

if (typeof supabase === 'undefined' || !/^https:\/\/.+\..+/.test(SUPABASE_URL) || /PEGA_AQUI/.test(SUPABASE_KEY)) {
  const msg = typeof supabase === 'undefined' ? 'No se pudo cargar la librería de conexión. Revisa tu internet y recarga la página.' : 'Falta configurar la conexión: en las dos primeras líneas del script de este archivo hay que pegar la URL y la clave publishable de tu proyecto en Supabase.';
  document.addEventListener('DOMContentLoaded', () => { document.body.innerHTML = '<div style="font-family:system-ui,sans-serif;max-width:420px;margin:40px auto;padding:20px;border:1px solid #ccc;border-radius:12px"><h2 style="margin-top:0">CAPITALIA</h2><p>' + msg + '</p></div>'; });
  throw new Error(msg);
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let me = null, perms = new Set(), tab = 'prestamos', aviso = null, rolSel = null, negocio = { nombre: NOMBRE_NEGOCIO };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const can = (m, a) => !!me && (me.es_admin || perms.has(m + ':' + a));
const setAviso = (t, tipo = 'err') => { aviso = t ? { t, tipo } : null; };
const avisoHtml = () => aviso ? `<div class="msg ${aviso.tipo}">${esc(aviso.t)}</div>` : '';

async function init() {
  if (SUPABASE_URL.startsWith('PEGA')) {
    $('#app').innerHTML = '<main><div class="card"><h2>Falta configurar</h2><p class="mute">Edita el archivo y pega la URL y la clave publishable de tu proyecto Supabase al inicio del script.</p></div></main>';
    return;
  }
  const { data } = await sb.auth.getSession();
  if (data.session) await cargarYo(); else vistaLogin();
}

async function cargarYo() {
  const { data: u } = await sb.auth.getUser();
  if (!u.user) return vistaLogin();
  const { data: p, error } = await sb.from('perfiles').select('*').eq('id', u.user.id).single();
  if (error || !p) { await sb.auth.signOut(); setAviso('No se encontró tu perfil.'); return vistaLogin(); }
  me = p; perms = new Set();
  alertasCache = null; negocio = { nombre: NOMBRE_NEGOCIO };
  if (!p.es_plataforma) {
    const { data: nx } = await sb.from('negocios').select('*').maybeSingle();
    if (!nx || nx.estado !== 'activo') { await sb.auth.signOut(); me = null; setAviso('Este negocio está suspendido o no está disponible. Comunícate con el soporte de la plataforma.'); return vistaLogin(); }
    negocio = { ...(nx.config || {}), id: nx.id, nombre: nx.nombre, codigo: nx.codigo };
  }
  if (!p.es_admin && p.role_id) {
    const { data: pm } = await sb.from('permisos').select('modulo,accion').eq('role_id', p.role_id);
    (pm || []).forEach(x => perms.add(x.modulo + ':' + x.accion));
  }
  if (!p.activo || (!p.es_admin && !p.es_plataforma && !p.role_id)) {
    await sb.auth.signOut(); me = null;
    setAviso('Tu cuenta todavía no tiene acceso. Pídele al administrador que la habilite.');
    return vistaLogin();
  }
  if (!tabsVisibles().includes(tab)) tab = tabsVisibles()[0] || 'personas';
  if (p.es_plataforma && tab === 'personas') tab = 'negocios';
  render();
}

function vistaLogin() {
  marcaPestana(true);
  $('#app').innerHTML = `<div class="login">
    <h1 class="marca" style="text-align:center;color:var(--brand);margin-bottom:4px">${esc(NOMBRE_PLATAFORMA)}</h1>
    <p class="mute" style="text-align:center;margin:0 0 14px">Administra tu negocio de préstamos</p>
    <form class="card" id="l-form" autocomplete="on">
      <h2>Iniciar sesión</h2>
      ${avisoHtml()}
      <label>Tu cuenta</label><input id="l-mail" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email" placeholder="usuario@negocio">
      <p class="mute" style="font-size:12px;margin:4px 0 0">Es el usuario y el código de tu negocio, separados por @. Si no lo sabes, pídeselo a tu administrador.</p>
      <label>Clave</label><input id="l-pass" type="password" autocomplete="current-password">
      <div style="margin-top:14px"><button style="width:100%" id="l-go" type="submit">Entrar</button></div>
      <p class="mute" style="font-size:12px;margin:12px 0 0;text-align:center">Después de ${MAX_INTENTOS} intentos fallidos el usuario se bloquea ${MIN_BLOQUEO} minutos.</p>
    </form></div>`;
  $('#l-form').onsubmit = async ev => {
    ev.preventDefault();
    const usuario = limpiarUsuario($('#l-mail').value), password = $('#l-pass').value;
    if (!usuario || !password) { setAviso('Escribe el usuario y la clave.'); return vistaLogin(); }
    const cta = partirCuenta(usuario);
    if (!cta) { setAviso('Escribe tu cuenta completa, con el código de tu negocio. Ejemplo: maria@minegocio'); return vistaLogin(); }
    $('#l-go').disabled = true;
    setAviso(null);
    // La clave se verifica en el servidor, que cuenta los intentos fallidos y bloquea al llegar al límite
    const { data: r, error: e0 } = await sb.rpc('verificar_acceso', { p_usuario: cta.usuario, p_codigo: cta.codigo, p_clave: password });
    if (e0) { setAviso('No se pudo verificar el acceso: ' + e0.message); return vistaLogin(); }
    if (r && r.estado === 'bloqueado') { setAviso(`Demasiados intentos fallidos. Este usuario está bloqueado, intenta de nuevo en ${Math.ceil((r.segundos || 60) / 60)} minuto(s).`); return vistaLogin(); }
    if (!r || r.estado !== 'ok') { setAviso('Usuario o clave incorrectos.'); return vistaLogin(); }
    const { error } = await sb.auth.signInWithPassword({ email: r.email, password });
    if (error) { setAviso('Usuario o clave incorrectos.'); return vistaLogin(); }
    await cargarYo();
  };
}

function tabsVisibles() {
  if (me && me.es_plataforma) return ['negocios'];
  const t = [];
  if (can('prestamos', 'ver')) t.push('prestamos');
  if (can('reportes', 'ver')) t.push('estadisticas');
  if (can('personas', 'ver')) t.push('personas');
  if (me && me.es_admin) t.push('usuarios', 'config');
  return t;
}

/* ---------------- PUNTOS DE MIL Y BUSCADOR DE CLIENTE ---------------- */
const milesTxt = n => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
function formatearMiles(t) {
  const antes = t.value, pos = t.selectionStart == null ? antes.length : t.selectionStart;
  const dig = antes.slice(0, pos).replace(/\D/g, '').length, solo = antes.replace(/\D/g, '');
  const f = solo ? milesTxt(solo) : '';
  if (f === antes) return;
  t.value = f;
  let n = 0, i = 0;
  for (; i < f.length && n < dig; i++) if (/\d/.test(f[i])) n++;
  try { t.setSelectionRange(i, i); } catch (e) {}
}
const sinTildes = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
let clientesBusca = [];
function buscarClientes(q) {
  const ts = sinTildes(q).split(/\s+/).filter(Boolean);
  if (!ts.length) return [];
  return clientesBusca.filter(p => {
    const t = sinTildes(p.nombre) + ' ' + String(p.cedula || '').replace(/\D/g, '');
    return ts.every(x => t.includes(x.replace(/\./g, '')));
  }).slice(0, 6);
}
function elegirCliente(id) {
  const p = clientesBusca.find(x => x.id === id);
  if (!p) return;
  $('#n-per').value = p.id;
  $('#n-res').innerHTML = '';
  $('#n-busca').hidden = true;
  $('#n-elegido').hidden = false;
  $('#n-elegido').innerHTML = '<span><b>' + esc(p.nombre) + '</b> <span class="mute">· CC ' + esc(p.cedula) + '</span></span><button class="sec sm" type="button" id="n-cambiar">Cambiar</button>';
}
document.addEventListener('input', e => {
  const t = e.target;
  if (!t) return;
  if (t.dataset && t.dataset.miles != null) formatearMiles(t);
  if (t.id === 'n-busca') {
    const box = $('#n-res');
    if (!t.value.trim()) { box.innerHTML = ''; return; }
    const r = buscarClientes(t.value);
    box.innerHTML = r.length
      ? r.map(p => '<button type="button" class="res-cli" data-pick="' + p.id + '"><b>' + esc(p.nombre) + '</b><span class="mute"> · CC ' + esc(p.cedula) + '</span></button>').join('')
      : '<div class="mute" style="padding:8px 2px">No encontré ese cliente. <button type="button" class="sec sm" id="n-ircli">Ir a Clientes</button></div>';
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'n-busca') {
    e.preventDefault();
    const r = buscarClientes(e.target.value);
    if (r.length) elegirCliente(r[0].id);
  }
});
document.addEventListener('click', e => {
  const b = e.target.closest ? e.target.closest('[data-pick], #n-cambiar, #n-ircli') : null;
  if (!b) return;
  if (b.id === 'n-ircli') { tab = 'personas'; setAviso(null); render(); return; }
  if (b.id === 'n-cambiar') { $('#n-per').value = ''; $('#n-elegido').hidden = true; $('#n-busca').hidden = false; $('#n-busca').value = ''; $('#n-busca').focus(); return; }
  elegirCliente(b.dataset.pick);
});

const FAV_CAPITALIA = 'data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%2314532d%27%2F%3E%3Ctext%20x%3D%2732%27%20y%3D%2747%27%20font-family%3D%27Georgia%2Cserif%27%20font-size%3D%2744%27%20font-weight%3D%27700%27%20fill%3D%27white%27%20text-anchor%3D%27middle%27%3EC%3C%2Ftext%3E%3C%2Fsvg%3E';
function inicialesNegocio(nom) {
  const ruido = /^(de|del|la|las|el|los|y|e|inversiones|prestamos|préstamos|creditos|créditos|capital|negocio|empresa|grupo|sas|s\.a\.s)$/i;
  const w = String(nom || '').trim().split(/\s+/).filter(x => x && !ruido.test(x));
  if (!w.length) return String(nom || 'C').trim().slice(0, 2).toUpperCase() || 'C';
  if (/^[A-ZÁÉÍÓÚÑ]{2,3}$/.test(w[0])) return w[0];
  return w.length > 1 ? (w[0][0] + w[1][0]).toUpperCase() : w[0].slice(0, 2).toUpperCase();
}
function favNegocio() {
  if (negocio.logo) return negocio.logo;
  try {
    const cv = document.createElement('canvas'); cv.width = cv.height = 64;
    const x = cv.getContext('2d');
    x.fillStyle = '#14532d'; x.beginPath(); x.arc(32, 32, 32, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = 'bold 28px Arial, sans-serif';
    x.fillText(inicialesNegocio(negocio.nombre), 32, 34);
    return cv.toDataURL('image/png');
  } catch (e) { return FAV_CAPITALIA; }
}
function marcaPestana(sinSesion) {
  try {
    const f = document.getElementById('fav');
    if (sinSesion || !me) { document.title = NOMBRE_PLATAFORMA; if (f) f.href = FAV_CAPITALIA; return; }
    if (me.es_plataforma) { document.title = NOMBRE_PLATAFORMA + ' - Panel'; if (f) f.href = FAV_CAPITALIA; return; }
    document.title = NOMBRE_PLATAFORMA + ' - ' + (negocio.nombre || NOMBRE_NEGOCIO);
    if (f) f.href = favNegocio();
  } catch (e) {}
}
const TAB_NOMBRE = { prestamos: 'Préstamos', personas: 'Clientes', alertas: 'Alertas', estadisticas: 'Estadísticas', importar: 'Importar', roles: 'Roles', usuarios: 'Equipo', config: 'Ajustes', cuenta: 'Mi clave', negocios: 'Negocios' };

  marcaPestana();

    <main id="vista" class="t-${tab}"></main>
    <nav>${t.map(x => `<button data-t="${x}" class="${x === tab ? 'on' : ''}">${TAB_NOMBRE[x]}</button>`).join('')}</nav>`;
  $('#salir').onclick = async () => { await sb.auth.signOut(); me = null; cuentaSel = null; setAviso(null); vistaLogin(); };

}

async function vRoles() {

  if (error) { v.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }

    setAviso(error ? error.message : null); vRoles();
  });
  if ($('#r-save')) $('#r-save').onclick = async () => {

/* ======================= PRÉSTAMOS ======================= */
const hoy = () => new Date().toLocaleDateString('en-CA');
const money = n => '$' + (Number(n || 0) < 0 ? '-' : '') + milesTxt(Math.abs(Number(n || 0)));
const fdate = s => s ? String(s).slice(0, 10).split('-').reverse().join('/') : '';
const diasEntre = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const entero = s => Number(String(s ?? '').replace(/\D/g, '')) || 0;
const decimal = s => Number(String(s ?? '').replace(',', '.'));
// Número que ve el cliente: arranca en 1001 para cada negocio
const pad = n => String(1000 + Number(n));
const nom = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '_').replace(/^_+|_+$/g, '');
const FREQ = { semanal: 'Semanal', quincenal: 'Quincenal', mensual: 'Mensual' };
const PERIODOS_MES = { semanal: 4, quincenal: 2, mensual: 1 };
const ORD_MES = ['', 'primer', 'segundo', 'tercer', 'cuarto', 'quinto', 'sexto', 'séptimo', 'octavo', 'noveno', 'décimo', 'undécimo', 'duodécimo'];
let cuentaSel = null, filtroPres = 'todos', vistaPres = 'tabla';

function calcCuenta(c) {
  const cu = (c.cuotas || []).slice().sort((a, b) => a.numero - b.numero);
  const pagado = cu.reduce((s, q) => s + Number(q.pagado), 0);
  const saldo = c.estado === 'anulado' ? 0 : Math.max(0, Number(c.total) - Number(c.descuento || 0) - pagado);
  const h = hoy();
  const sinPagar = q => Number(q.pagado) < Number(q.valor);
  const atrasadas = c.estado === 'vigente' ? cu.filter(q => q.fecha_vencimiento < h && sinPagar(q)) : [];
  const vencido = Math.min(saldo, atrasadas.reduce((s, q) => s + Number(q.valor) - Number(q.pagado), 0));
  const proxima = c.estado === 'vigente' ? cu.find(sinPagar) || null : null;
  return { cu, pagado, saldo, atrasadas, vencido, proxima, mora: atrasadas.length > 0,
    diasMora: atrasadas.length ? diasEntre(atrasadas[0].fecha_vencimiento, h) : 0 };
}
const estadoCuenta = (c, k) => c.estado === 'anulado' ? ['Anulado', ''] : c.estado === 'refinanciado' ? ['Refinanciado', ''] : c.estado === 'pagado' ? ['Paz y salvo', 'ok'] : k.mora ? ['En mora', 'bad'] : ['Al día', 'ok'];
// Lo que el cliente debe pagar ahora: lo vencido si está en mora, o la próxima cuota.
function cuotaAPagar(k, c) {
  if (c.estado !== 'vigente') return null;
  if (k.mora) return { valor: k.vencido, fecha: k.atrasadas[0].fecha_vencimiento, vencida: true };
  if (k.proxima) return { valor: Math.min(k.saldo, Number(k.proxima.valor) - Number(k.proxima.pagado)), fecha: k.proxima.fecha_vencimiento, vencida: false };
  return null;
}
// Interés por mes empezado: meses = cuotas ÷ cuotas por mes, redondeado hacia arriba
const interesMes = (cap, tasa, fre, n) => { const m = Math.ceil(n / PERIODOS_MES[fre]); return { meses: m, inte: Math.round(cap * tasa / 100 * m) }; };
const mesesDe = c => { const b = Number(c.capital) * Number(c.tasa_mensual) / 100; return b ? Math.round(Number(c.interes_total) / b * 100) / 100 : 0; };
const mesesTxt = m => (Number.isInteger(m) ? String(m) : String(m)) + (m === 1 ? ' mes' : ' meses');
const NOMBRES_FILTRO = { todos: 'Todos', mora: 'En mora', hoy: 'Cobran hoy', prox: 'Próximos 3 días', vigentes: 'Vigentes', pagados: 'Paz y salvo', refinanciados: 'Refinanciados', anulados: 'Anulados' };
const btnWa = c => { if (c.estado !== 'vigente' || c.u > 2) return ''; const w = enlaceCobro(c, c.k); return w ? `<a class="btn sm" href="${w}" target="_blank" rel="noopener" onclick="event.stopPropagation()">WhatsApp</a>` : '<span class="mute" style="font-size:12px">Sin teléfono</span>'; };

function tablaPrestamos(lista) {
  const filas = lista.map(c => ({ c, a: cuotaAPagar(c.k, c) }));
  const totPag = lista.reduce((s, c) => s + c.k.pagado, 0), totSal = lista.reduce((s, c) => s + c.k.saldo, 0), totCuo = filas.reduce((s, f) => s + (f.a ? f.a.valor : 0), 0);
  return `<div style="overflow-x:auto;margin:0 -14px"><table class="matrix tabla"><thead><tr><th>Cliente</th><th>Pagado</th><th>Saldo</th><th>Cuota a pagar</th></tr></thead><tbody>
    ${filas.map(({ c, a }) => `<tr data-c="${c.id}" class="${c.u === 0 ? 'fila-mora' : ''}" style="cursor:pointer"><td><b>${esc(c.personas?.nombre || '—')}</b><div class="mute" style="font-size:11px">#${pad(c.consecutivo)}${c.tipo === 'fiado' ? ' · Producto' + (c.descripcion ? ': ' + esc(c.descripcion) : '') : ''}</div>${tagHtml(estadoCuenta(c, c.k))}</td><td>${money(c.k.pagado)}</td><td><b>${money(c.k.saldo)}</b></td><td>${a ? `<b class="${a.vencida ? 'bad-t' : ''}">${money(a.valor)}</b><br><span class="mute">${a.vencida ? 'desde ' : 'vence '}${fdate(a.fecha).slice(0, 5)}</span>` : '—'}${btnWa(c) ? `<div style="margin-top:4px">${btnWa(c)}</div>` : ''}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>Total (${lista.length})</td><td>${money(totPag)}</td><td>${money(totSal)}</td><td>${money(totCuo)}</td></tr></tfoot></table></div>`;
}
function tarjetasPrestamos(lista) {
  return lista.map(c => `
    <div class="item ${c.u === 0 ? 'mora' : ''}" data-c="${c.id}" style="cursor:pointer">
      <div class="row"><div><b>#${pad(c.consecutivo)} · ${esc(c.personas?.nombre || '—')}</b> ${tagHtml(estadoCuenta(c, c.k))}${c.tipo === 'fiado' ? `<div class="mute" style="font-size:12px">Producto a crédito${c.descripcion ? ': ' + esc(c.descripcion) : ''}</div>` : ''}</div><b>${money(c.k.saldo)}</b></div>
      <div class="mute">${c.estado === 'vigente'
        ? (c.k.mora ? `${c.k.atrasadas.length} cuota(s) vencida(s) · ${c.k.diasMora} días de atraso · debe ${money(c.k.vencido)}`
          : c.k.proxima ? `Próxima cuota: ${fdate(c.k.proxima.fecha_vencimiento)} · ${money(Number(c.k.proxima.valor) - Number(c.k.proxima.pagado))}` : '')
        : `Capital ${money(c.capital)} · ${c.num_cuotas} cuotas`}</div>
      ${btnWa(c) ? `<div class="acciones" style="margin-top:8px">${btnWa(c)}</div>` : ''}
    </div>`).join('');
}
const tagHtml = ([t, cls]) => `<span class="tag ${cls}">${t}</span>`;

      ${puedeBorrar ? `<p class="mute" style="font-size:13px;margin-top:0">Se borra por completo, con sus cuotas. Solo es posible porque no tiene pagos. Queda en el registro de auditoría.</p><button class="bad" id="b-borrar">Eliminar este préstamo</button>`
      : `<p class="mute" style="font-size:13px;margin:0">No se puede eliminar: ${c.refinancia_a || (ref && ref.viejo.id === c.id) ? 'está enlazado a una refinanciación. Si fue un error, usa «Deshacer refinanciación».' : !sinPagos ? 'ya tiene pagos registrados. Si fue un error, anula primero esos pagos.' : 'este préstamo ya no está vigente.'}</p>`}
    </div>` : ''}

    ${vigente && (me.es_admin || can('prestamos', 'anular')) ? `<div class="card"><h2>Administración</h2>

        ${me.es_admin ? '<button class="sec" id="b-desc">Aplicar descuento</button>' : ''}

  $('#back').onclick = () => { cuentaSel = null; setAviso(null); vPrestamos(); };

  if ($('#pg-go')) $('#pg-go').onclick = async () => {

  if ($('#b-desc')) $('#b-desc').onclick = async () => {
    const sug = c.cuotas.filter(q => q.fecha_vencimiento > h && Number(q.pagado) === 0).reduce((s, q) => s + Number(q.interes_parte), 0);

    if (!motivo) return;
    $('#b-desc').disabled = true;
    const { error } = await sb.rpc('aplicar_descuento', { p_cuenta: c.id, p_monto: m, p_motivo: motivo });
    fin(error, 'Descuento aplicado.');
  };
  if ($('#b-anular')) $('#b-anular').onclick = async () => {
    const motivo = (prompt('Motivo de la anulación del préstamo:') || '').trim();
    if (!motivo) return;
    $('#b-anular').disabled = true;
    const { error } = await sb.rpc('anular_prestamo', { p_cuenta: c.id, p_motivo: motivo });
    fin(error, 'Préstamo anulado.');
  };
  document.querySelectorAll('[data-doc]').forEach(b => b.onclick = () => generar(() =>
    ({ amort: docAmortizacion, cobro: docCobro, paz: docPazYSalvo, refi: () => docRefinanciacion(ref, per) })[b.dataset.doc](c, k, per, pagos)));
  document.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => generar(() =>

  if ($('#ed-go')) {
    const calcEd = () => {
      const cap = entero($('#ed-cap').value), tasa = decimal($('#ed-tasa').value), fre = $('#ed-fre').value, n = entero($('#ed-cuo').value);
      if (!cap || !n || isNaN(tasa)) return null;
      const { meses, inte } = interesMes(cap, tasa, fre, n);
      return { cap, tasa, fre, n, meses, inte, tot: cap + inte };
    };
    const prevEd = () => { const r = calcEd(); $('#ed-prev').innerHTML = r ? 'Interés ' + money(r.inte) + ' (' + r.tasa + '% × ' + mesesTxt(r.meses) + ') · Total <b>' + money(r.tot) + '</b> · ' + r.n + ' cuotas de <b>' + money(Math.round(r.tot / r.n)) + '</b>' : 'Completa los datos para ver el cálculo.'; };
    ['ed-cap', 'ed-tasa', 'ed-fre', 'ed-cuo'].forEach(id => $('#' + id).oninput = prevEd); prevEd();

      const { error } = await sb.rpc('editar_prestamo', { p_cuenta: c.id, p_capital: r.cap, p_tasa: r.tasa, p_frecuencia: r.fre, p_cuotas: r.n, p_fecha: $('#ed-fec').value, p_descripcion: $('#ed-desc') ? $('#ed-desc').value.trim() : null });
      if (error) { $('#ed-msg').innerHTML = '<div class="msg err">' + esc(error.message) + '</div>'; $('#ed-go').disabled = false; return; }
      fin(null, 'Préstamo corregido.');

  if ($('#b-borrar')) $('#b-borrar').onclick = async () => {
    if (!confirm('¿Eliminar el préstamo ' + pad(c.consecutivo) + ' de ' + per.nombre + '? Esta acción no se puede deshacer.')) return;

  };
  document.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => { cuentaSel = b.dataset.ir; setAviso(null); vPrestamos(); });
  if ($('#b-deshacer')) $('#b-deshacer').onclick = async () => {
    const motivo = (prompt('Motivo para deshacer la refinanciación (el préstamo anterior vuelve a quedar vigente):') || '').trim();
    if (!motivo) return;

    fin(error, 'Refinanciación deshecha. El préstamo anterior volvió a quedar vigente.');
  };
  if ($('#rf-go')) {
    const calc = () => {
      const cap = entero($('#rf-cap').value), tasa = decimal($('#rf-tasa').value), fre = $('#rf-fre').value, n = entero($('#rf-cuo').value);
      if (!cap || !n || isNaN(tasa)) return null;
      const { meses, inte } = interesMes(cap, tasa, fre, n), tot = cap + inte;
      return { cap, tasa, fre, n, meses, inte, tot, giro: cap - k.saldo };
    };
    const prevRf = () => {
      const r = calc(), box = $('#rf-prev');
      if (!r) { box.innerHTML = 'Escribe el valor, la tasa y las cuotas para ver el cálculo.'; $('#rf-go').disabled = true; return; }
      if (r.cap < k.saldo) { box.innerHTML = '<b class="bad-t">El valor nuevo debe ser al menos lo que debe el cliente (' + money(k.saldo) + ').</b>'; $('#rf-go').disabled = true; return; }
      $('#rf-go').disabled = false;
      box.innerHTML = 'Se cancela la deuda de hoy: <b>' + money(k.saldo) + '</b><br>Préstamo nuevo: <b>' + money(r.cap) + '</b> · interés ' + money(r.inte) + ' (' + r.tasa + '% × ' + mesesTxt(r.meses) + ') · total ' + money(r.tot) + '<br>' + r.n + ' cuotas de <b>' + money(Math.round(r.tot / r.n)) + '</b><br><span style="font-size:17px">Dinero a entregar al cliente: <b>' + money(r.giro) + '</b></span>';
    };
    ['rf-cap', 'rf-tasa', 'rf-fre', 'rf-cuo'].forEach(id => $('#' + id).oninput = prevRf);
    prevRf();
    $('#rf-go').onclick = async () => {
      const r = calc();
      if (!r || r.cap < k.saldo) return;
      if (!confirm('¿Refinanciar el préstamo #' + pad(c.consecutivo) + ' de ' + per.nombre + '?\n\nSe cancela la deuda de ' + money(k.saldo) + '.\nPréstamo nuevo: ' + money(r.cap) + '.\nSe entregan: ' + money(r.giro) + '.')) return;
      $('#rf-go').disabled = true;
      const { data, error } = await sb.rpc('refinanciar_prestamo', { p_cuenta: c.id, p_capital: r.cap, p_tasa: r.tasa, p_frecuencia: r.fre, p_cuotas: r.n, p_fecha: $('#rf-fec').value || h });
      if (error) { $('#rf-msg').innerHTML = '<div class="msg err">' + esc(error.message) + '</div>'; $('#rf-go').disabled = false; return; }
      cuentaSel = data.nueva;
      setAviso('Refinanciado. Entrega al cliente ' + money(data.giro) + '. Ya puedes enviarle el documento de refinanciación.', 'ok'); vPrestamos();
    };
  }
  if ($('#wa-go')) {
    const ir = async () => {
      const out = $('#wa-msg'); out.innerHTML = '';
      try {
        const t = await enviarWa($('#wa-doc').value, c, k, per, pagos);
        if (t) out.innerHTML = '<div class="msg ok">' + esc(t) + '</div>';
      } catch (e) { out.innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; }
    };
    $('#wa-go').onclick = () => ir();
  }
}

let capturaPdf = null, refActual = null;
function mensajeWa(tipo, c, k, per, pagos, url) { return msgDoc(tipo, c, k, per, pagos, url); }
function pdfWa(tipo, c, k, per, pagos) {
  capturaPdf = {};
  try {
    if (!window.jspdf) throw new Error('No se cargó el generador de PDF. Revisa tu conexión a internet.');
    if (tipo === 'recibo') docRecibo(c, k, per, [...pagos].reverse().find(x => x.estado === 'activo' && x.metodo !== 'refinanciación'));
    else if (tipo === 'refi') docRefinanciacion(refActual, per);
    else ({ amort: docAmortizacion, cobro: docCobro, paz: docPazYSalvo })[tipo](c, k, per, pagos);
    return capturaPdf;
  } finally { capturaPdf = null; }
}
async function enviarWa(tipo, c, k, per, pagos) {
  const tel = telWa(per.telefono);
  if (!tel) throw new Error('Este cliente no tiene teléfono registrado. Agrégalo en Clientes.');
  const msg = mensajeWa(tipo, c, k, per, pagos);
  if (!msg) throw new Error('Ese mensaje no aplica para este préstamo.');
  window.open('https://wa.me/' + tel + '?text=' + encodeURIComponent(msg), '_blank');
  return 'Se abrió el chat de ' + (per.nombre || 'el cliente') + ' con el mensaje listo. Solo falta pulsar enviar.';
}

function generar(fn) {
  try {
    if (!window.jspdf) throw new Error('No se cargó el generador de PDF. Revisa tu conexión a internet.');
    fn();
  } catch (e) { alert('No se pudo generar el documento: ' + e.message); }
}

function letras(n) {
  n = Math.floor(Math.abs(n));
  if (n === 0) return 'cero';
  if (n >= 1e9) return String(n);
  const U = ['', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés', 'veinticuatro', 'veinticinco', 'veintiséis', 'veintisiete', 'veintiocho', 'veintinueve'];
  const D = ['', '', '', 'treinta', 'cuarenta', 'cincuenta', 'sesenta', 'setenta', 'ochenta', 'noventa'];
  const C = ['', 'ciento', 'doscientos', 'trescientos', 'cuatrocientos', 'quinientos', 'seiscientos', 'setecientos', 'ochocientos', 'novecientos'];
  const apoc = s => s.replace(/veintiuno$/, 'veintiún').replace(/uno$/, 'un');
  const m1000 = x => {
    if (x === 100) return 'cien';
    const c = Math.floor(x / 100), r = x % 100;
    let s = c ? C[c] + (r ? ' ' : '') : '';
    if (r < 30) s += U[r]; else { const d = Math.floor(r / 10), u = r % 10; s += D[d] + (u ? ' y ' + U[u] : ''); }
    return s;
  };
  const mill = Math.floor(n / 1e6), mil = Math.floor((n % 1e6) / 1e3), resto = n % 1e3, out = [];
  if (mill) out.push(mill === 1 ? 'un millón' : apoc(m1000(mill)) + ' millones');

function nuevoDoc(titulo) {

const kv = (doc, y, pares) => {
  pares.forEach(([clave, val]) => {

    doc.setFont('helvetica', 'normal');

};
const parrafo = (doc, y, t) => { const l = doc.splitTextToSize(t, 186); doc.text(l, 15, y); return y + 5.5 * l.length + 3; };
const negrita = (doc, y, t) => { doc.setFont('helvetica', 'bold'); doc.text(t, 15, y); doc.setFont('helvetica', 'normal'); return y + 6; };
const tablaEstilo = { styles: { fontSize: 9, halign: 'right' }, headStyles: { fillColor: [20, 83, 45], halign: 'right' }, footStyles: { fillColor: [230, 238, 233], textColor: 0 }, margin: { left: 15, right: 15 } };

let logoSel = { logo: '', w: 0, h: 0 }, qrSel = { logo: '', w: 0, h: 0 };
function leerLogo(file, cuadrado) {
  return new Promise((ok, mal) => {
    if (!file || !/^image\/(png|jpe?g|webp|gif)$/.test(file.type)) return mal(new Error('Elige una imagen PNG o JPG.'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('No se pudo leer esa imagen.')); };
    img.onload = () => {
      URL.revokeObjectURL(url);
      const png = /png|gif|webp/.test(file.type);
      for (const max of cuadrado ? [320, 240, 180] : [420, 300, 200]) {
        const r = Math.min(1, max / img.width, (cuadrado ? max : max * 0.45) / img.height), w = Math.max(1, Math.round(img.width * r)), hh = Math.max(1, Math.round(img.height * r));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
        const cx = cv.getContext('2d');
        if (!png) { cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, hh); }
        cx.drawImage(img, 0, 0, w, hh);
        const d = png ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.85);
        if (d.length < 200000) return ok({ logo: d, w, h: hh });
      }
      mal(new Error('La imagen es muy pesada. Usa una más pequeña.'));
    };
    img.src = url;
  });
}

// Medios de pago y QR dentro de los PDF
function medioPagoPdf(doc, y) {
  const l = mediosPagoLineas();
  if (!l.length && !negocio.qr) return y;
  if (y > 220) { doc.addPage(); y = 25; }
  doc.setFont('helvetica', 'bold'); doc.text('Medios de pago', 15, y); doc.setFont('helvetica', 'normal');
  const y0 = y + 6; let yt = y0, yq = y0;
  l.forEach(t => { const ls = doc.splitTextToSize(t, 140); doc.text(ls, 15, yt); yt += 5.2 * ls.length; });
  if (negocio.qr) {
    try {
      const r = Math.min(34 / negocio.qr_w, 34 / negocio.qr_h), w = negocio.qr_w * r, hh = negocio.qr_h * r;
      doc.addImage(negocio.qr, /^data:image\/png/.test(negocio.qr) ? 'PNG' : 'JPEG', 201 - w, y0 - 2, w, hh);
      yq = y0 - 2 + hh;
    } catch (e) { yq = y0; }
  }
  const fin = Math.max(yt, yq) + 1;
  doc.setFontSize(9); doc.text('Indica tu referencia al realizar el pago.', 15, fin); doc.setFontSize(10);
  return fin + 8;
}


/* ---------------- ESTADÍSTICAS ---------------- */
let vistaEst = 'graf', estDatos = null;
const MES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const mesCorto = m => MES_C[Number(m.slice(5, 7)) - 1];
const mesLargo = m => MES_L[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(0, 4);
const num = n => Number(n || 0);
const pct = (a, b) => b > 0 ? Math.round(a * 100 / b) : 0;
function compacto(n) {
  n = num(n); const a = Math.abs(n);
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.', ',').replace(',0', '') + ' M';
  if (a >= 1e3) return Math.round(n / 1e3) + ' mil';
  return String(Math.round(n));
}
const dineroC = n => '$' + compacto(n);
function hace(dias) {
  dias = num(dias);
  if (dias < 1) return 'hoy';
  if (dias < 45) return `hace ${dias} día${dias === 1 ? '' : 's'}`;
  if (dias < 730) { const m = Math.round(dias / 30.4); return `hace ${m} meses`; }
  const a = Math.floor(dias / 365), m = Math.round((dias - a * 365) / 30.4);
  return `hace ${a} año${a === 1 ? "" : "s"}` + (m > 0 && m < 12 ? ` y ${m} mes${m === 1 ? '' : 'es'}` : '');
}
function ticks(max) {
  if (max <= 0) return [0, 1];
  const p = Math.pow(10, Math.floor(Math.log10(max / 3)));
  const paso = [1, 2, 5, 10].map(f => f * p).find(s => max / s <= 4) || 10 * p;
  const t = []; for (let v = 0; v <= max + paso * 0.001; v += paso) t.push(v);
  if (t[t.length - 1] < max) t.push(t[t.length - 1] + paso);
  return t;
}
// Barra con el extremo superior redondeado (4px) y la base recta
function barraPath(x, y, w, h, redondear) {
  const r = redondear ? Math.min(4, w / 2, h) : 0;
  return `M${x},${y + h}V${y + r}${r ? `Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}` : `H${x + w}`}V${y + h}Z`;
}
// Gráfico de columnas (apiladas o simples). series: [{k, nombre, color}]
function columnas(id, filas, series, opts = {}) {
  const W = 340, H = 180, pl = 46, pr = 6, pt = 10, pb = 24, iw = W - pl - pr, ih = H - pt - pb;
  const tot = f => series.reduce((s, x) => s + num(f[x.k]), 0);
  const tk = ticks(Math.max(...filas.map(tot), 0));
  const top = tk[tk.length - 1] || 1;
  const slot = iw / filas.length, bw = Math.min(24, slot - 6);
  const Y = v => pt + ih - (v / top) * ih;
  let g = tk.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}" class="v-grid"/><text x="${pl - 5}" y="${Y(t) + 3.5}" text-anchor="end" class="v-eje">${opts.dinero === false ? compacto(t) : compacto(t)}</text>`).join('');
  filas.forEach((f, i) => {
    const cx = pl + slot * i + slot / 2, x = cx - bw / 2;
    let acum = 0;
    const vis = series.filter(s => num(f[s.k]) > 0);
    vis.forEach((s, j) => {
      const v = num(f[s.k]), y0 = Y(acum + v), h = Math.max(Y(acum) - y0 - (vis.length > 1 && j < vis.length - 1 ? 0 : 0), 0);
      const gap = j > 0 ? 2 : 0;           // 2px de superficie entre segmentos apilados
      const yy = y0, hh = Math.max(h - gap, 1);
      g += `<path d="${barraPath(x, yy, bw, hh, j === vis.length - 1)}" class="v-barra" style="fill:var(${s.color})" data-i="${i}"/>`;
      acum += v;
    });
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" class="v-eje">${mesCorto(f.mes)}</text>`;
    g += `<rect x="${pl + slot * i}" y="${pt}" width="${slot}" height="${ih + pb}" class="v-hit" data-g="${id}" data-i="${i}" tabindex="0" role="img" aria-label="${mesLargo(f.mes)}: ${series.map(s => s.nombre + ' ' + (opts.fmt || money)(f[s.k])).join(', ')}"/>`;
  });
  g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(0)}" y2="${Y(0)}" class="v-base"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="v-svg" id="${id}" role="group">${g}</svg>`;
}
const leyenda = series => `<div class="v-ley">${series.map(s => `<span><i style="background:var(${s.color})"></i>${s.nombre}</span>`).join('')}</div>`;
function barrasH(filas, color, fmt = money) {
  const max = Math.max(...filas.map(f => num(f.v)), 1);
  return filas.map(f => `<div class="v-fila"><div class="v-et">${esc(f.et)}</div><div class="v-pista"><div class="v-rel" style="width:${Math.max(num(f.v) / max * 100, num(f.v) > 0 ? 1.5 : 0)}%;background:var(${f.color || color})"></div></div><div class="v-val">${esc(fmt(f.v))}${f.sub ? `<small>${esc(f.sub)}</small>` : ''}</div></div>`).join('');
}

function activarTips(mapa) {

    const [filas, series, fmt] = mapa[el.dataset.g], f = filas[Number(el.dataset.i)];

    el.addEventListener('blur', ocultar);

let alertasCache = null;
const DIAS_AVISO = 3;
async function datosAlertas() {
  const { data, error } = await sb.from('cuentas').select('*,personas(nombre,cedula,telefono),cuotas(numero,fecha_vencimiento,valor,pagado)').eq('estado', 'vigente').limit(1000);
  if (error) throw new Error(error.message);
  const h = hoy(), mora = [], hoyL = [], prox = [];
  (data || []).forEach(c => {
    const k = calcCuenta(c);
    if (k.mora) { mora.push({ c, k, valor: k.vencido, dias: k.diasMora }); return; }
    const pend = k.cu.filter(q => Number(q.pagado) < Number(q.valor));
    const dHoy = pend.filter(q => q.fecha_vencimiento === h);
    if (dHoy.length) { hoyL.push({ c, k, valor: dHoy.reduce((s, q) => s + Number(q.valor) - Number(q.pagado), 0), fecha: h }); return; }
    const q = pend.find(x => diasEntre(h, x.fecha_vencimiento) >= 1 && diasEntre(h, x.fecha_vencimiento) <= DIAS_AVISO);
    if (q) prox.push({ c, k, valor: Number(q.valor) - Number(q.pagado), fecha: q.fecha_vencimiento });
  });
  mora.sort((a, b) => b.dias - a.dias); prox.sort((a, b) => a.fecha.localeCompare(b.fecha));
  alertasCache = { t: Date.now(), n: mora.length + hoyL.length, mora, hoy: hoyL, prox };
  return alertasCache;
}
async function badgeAlertas() {
  if (!can('prestamos', 'ver')) return;
  try {
    const a = alertasCache && Date.now() - alertasCache.t < 60000 ? alertasCache : await datosAlertas();
    const b = document.querySelector('nav button[data-t="prestamos"]');
    if (b && a.n > 0) { b.textContent = TAB_NOMBRE.prestamos + ' '; const s = document.createElement('span'); s.className = 'badge'; s.textContent = a.n; b.appendChild(s); }
  } catch (e) { /* el aviso es opcional */ }
}
const telWa = t => { const d = String(t || '').replace(/\D/g, ''); return d.length === 10 ? '57' + d : d; };
// Enlace directo al chat del cliente, con el mensaje de cobro ya escrito
function enlaceCobro(c, k) {
  const per = c.personas || {}, t = telWa(per.telefono), msg = msgCobro(c, k, per);
  return t && msg ? `https://wa.me/${t}?text=${encodeURIComponent(msg)}` : '';
}
// Urgencia para ordenar: 0 mora · 1 cobra hoy · 2 próximos días · 3 al día · 4 pagado · 5 refinanciado · 6 anulado
function urgenciaDe(c, k) {
  if (c.estado === 'anulado') return 6;
  if (c.estado === 'refinanciado') return 5;
  if (c.estado === 'pagado') return 4;
  if (k.mora) return 0;
  const h = hoy(), pend = k.cu.filter(q => Number(q.pagado) < Number(q.valor));
  if (pend.some(q => q.fecha_vencimiento === h)) return 1;
  if (pend.some(q => { const d = diasEntre(h, q.fecha_vencimiento); return d >= 1 && d <= DIAS_AVISO; })) return 2;
  return 3;
}

function descargarPlantilla() {
  const bin = atob(PLANTILLA_B64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const a = document.createElement('a');

  a.download = 'Plantilla_carga_masiva.xlsx'; document.body.appendChild(a); a.click(); a.remove();

const txt = v => String(v ?? '').trim();
const idTxt = v => typeof v === 'number' ? String(Math.round(v)) : txt(v).replace(/\s/g, '').replace(/\.0+$/, '');
function numero(v) {
  if (typeof v === 'number') return v;
  let s = txt(v).replace(/[$\s]/g, '');
  if (!s) return null;
  if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
  else s = s.replace(',', '.');
  const n = Number(s); return isNaN(n) ? NaN : n;
}
function fechaIso(v) {
  if (v === '' || v == null) return null;
  const f = (y, m, d) => { const dt = new Date(Date.UTC(y, m - 1, d)); return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d ? dt.toISOString().slice(0, 10) : undefined; };
  if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 86400000)); return f(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
  if (v instanceof Date) return f(v.getFullYear(), v.getMonth() + 1, v.getDate());
  let m = txt(v).match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (m) return f(+m[3], +m[2], +m[1]);
  m = txt(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m ? f(+m[1], +m[2], +m[3]) : undefined;
}
function leerHoja(wb, nombre) {

function analizarLibro(wb, modo) {

  const nuevoFmt = /^cliente/i.test(txt(encP[0]));

  (modo === 'prestamos' ? [] : hc || []).forEach(({ fila, r }) => {
    const x = { fila, cedula: idTxt(r[0]), nombre: txt(r[1]), telefono: idTxt(r[2]), tipo: 'cliente', direccion: txt(r[3]), barrio: txt(r[4]), notas: txt(r[5]) };

    if (!['semanal', 'quincenal', 'mensual'].includes(x.frecuencia)) p.push('frecuencia debe ser semanal, quincenal o mensual');

}

      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
      impDatos = analizarLibro(wb, modo);
      revision(res, puedeC, puedeP, modo);
    } catch (e) { res.innerHTML = `<div class="msg err">No se pudo leer el archivo: ${esc(e.message)}</div>`; }
  };
}
function revision(res, puedeC, puedeP, modo) {
  const d = impDatos;
  if (d.faltan.length) { res.innerHTML = `<div class="msg err">Al archivo le falta la hoja: ${d.faltan.map(esc).join(', ')}. Usa la plantilla descargada aquí sin cambiarle el nombre a las hojas.</div>`; return; }
  const lista = (m, hoja) => m.length ? `<details open><summary class="bad-t">${m.length} fila(s) con problemas en «${hoja}» (no se cargarán)</summary><ul class="prob">${m.slice(0, 100).map(x => `<li>Fila ${x.fila}: ${esc(x.motivo)}</li>`).join('')}${m.length > 100 ? `<li>…y ${m.length - 100} más</li>` : ''}</ul></details>` : '';
  const cuotaDe = x => { const pm = PERIODOS_MES[x.frecuencia], t = x.capital + Math.round(x.capital * (x.tasa === '' ? 20 : x.tasa) / 100 * Math.ceil(x.cuotas / pm)); return { t, c: Math.round(t / x.cuotas) }; };
  const filasP = d.prestamos.slice(0, 50).map(x => { const q = cuotaDe(x); return `<tr><td>${esc(x.cedula)}</td><td>${money(x.capital)}</td><td>${x.pagadas}/${x.cuotas}</td><td>${x.cuotas - x.pagadas}</td><td>${money(Math.max(0, q.t - x.pagadas * q.c - x.abono))}</td></tr>`; }).join('');
  const hayAlgo = (puedeC && d.clientes.length) || (puedeP && d.prestamos.length);
  res.innerHTML = `<div class="card"><h2>Revisión</h2>
    <div class="stats" style="margin-bottom:8px">
      ${modo !== 'prestamos' ? `<div class="stat"><span>Clientes listos</span><b>${d.clientes.length}</b><small class="mute">${d.malC.length} con problemas</small></div>` : ''}${modo !== 'clientes' ? `<div class="stat"><span>Préstamos listos</span><b>${d.prestamos.length}</b><small class="mute">${d.malP.length} con problemas</small></div>` : ''}</div>
    ${lista(d.malC, 'Clientes')}${lista(d.malP, 'Préstamos')}
    ${d.prestamos.length ? `<h3 style="font-size:14px;margin:12px 0 4px">Cómo quedarán los préstamos${d.prestamos.length > 50 ? ' (primeros 50)' : ''}</h3>
      <div style="overflow-x:auto;margin:0 -14px"><table class="matrix tabla"><thead><tr><th>Cédula</th><th>Capital</th><th>Pagadas</th><th>Debe</th><th>Saldo aprox.</th></tr></thead><tbody>${filasP}</tbody></table></div>` : ''}
    <p class="mute" style="font-size:13px">Los clientes que ya existen y los préstamos ya cargados no se duplican ni se modifican.</p>
    <button id="i-go" ${hayAlgo ? '' : 'disabled'}>Cargar ${puedeC ? d.clientes.length + ' cliente(s)' : ''}${puedeC && puedeP ? ' y ' : ''}${puedeP ? d.prestamos.length + ' préstamo(s)' : ''}</button>
    </div><div id="i-fin"></div>`;
  $('#i-go').onclick = () => cargarTodo(puedeC, puedeP, modo);
}
async function cargarTodo(puedeC, puedeP, modo) {
  const d = impDatos, fin = $('#i-fin'), btn = $('#i-go');
  btn.disabled = true; fin.innerHTML = '<p class="mute">Cargando… no cierres esta pantalla.</p>';
  const resumen = { C: { creados: 0, omitidos: 0, errores: [] }, P: { creados: 0, omitidos: 0, errores: [] } };
  try {
    if (puedeC && d.clientes.length) for (const l of lotes(d.clientes)) {
      const { data, error } = await sb.rpc('importar_clientes', { p_filas: l });
      if (error) throw new Error(error.message);
      resumen.C.creados += data.creados; resumen.C.omitidos += data.omitidos; resumen.C.errores.push(...data.errores);
    }
    if (puedeP && d.prestamos.length) for (const l of lotes(d.prestamos)) {
      const { data, error } = await sb.rpc('importar_prestamos', { p_filas: l });
      if (error) throw new Error(error.message);
      resumen.P.creados += data.creados; resumen.P.omitidos += data.omitidos; resumen.P.errores.push(...data.errores);
    }
  } catch (e) { fin.innerHTML = `<div class="msg err">Se detuvo la carga: ${esc(e.message)}. Lo ya cargado quedó guardado; puedes volver a subir el archivo sin duplicar.</div>`; btn.disabled = false; return; }
  alertasCache = null; estDatos = null;
  const err = (l, hoja) => l.length ? `<details open><summary>Avisos de «${hoja}» (${l.length})</summary><ul class="prob">${l.map(x => `<li>Fila ${x.fila}: ${esc(x.motivo)}</li>`).join('')}</ul></details>` : '';
  fin.innerHTML = `<div class="card"><h2>Resultado</h2>
    <div class="stats" style="margin-bottom:8px">
      ${modo !== 'prestamos' ? `<div class="stat"><span>Clientes cargados</span><b>${resumen.C.creados}</b><small class="mute">${resumen.C.omitidos} ya existían</small></div>` : ''}${modo !== 'clientes' ? `<div class="stat"><span>Préstamos cargados</span><b>${resumen.P.creados}</b><small class="mute">${resumen.P.omitidos} ya estaban</small></div>` : ''}</div>
    ${modo !== 'prestamos' ? err(resumen.C.errores, 'Clientes') : ''}${modo !== 'clientes' ? err(resumen.P.errores, 'Préstamos') : ''}
    <p style="margin-bottom:0">${modo !== 'prestamos' ? '<button class="sec" id="i-verc">Ver clientes</button> ' : ''}${modo !== 'clientes' ? '<button id="i-ver">Ver préstamos</button>' : ''}</p></div>`;
  if ($('#i-ver')) $('#i-ver').onclick = () => { tab = 'prestamos'; cuentaSel = null; render(); };
  if ($('#i-verc')) $('#i-verc').onclick = () => { tab = 'personas'; cuentaSel = null; render(); };
}

async function traerTodo(tabla) {
  const out = [];
  for (let d = 0; ; d += 1000) {
    const { data, error } = await sb.from(tabla).select('*').order('id').range(d, d + 999);
    if (error) throw new Error(error.message);
    out.push(...(data || []));
    if (!data || data.length < 1000) break;
  }
  return out;
}
async function exportarTodo() {
  await cargarXlsx();
  const [per, cu, qs, pg] = await Promise.all([traerTodo('personas'), traerTodo('cuentas'), traerTodo('cuotas'), traerTodo('pagos')]);
  const porPer = Object.fromEntries(per.map(p => [p.id, p])), porCu = Object.fromEntries(cu.map(c => [c.id, c]));
  const pagadoDe = id => qs.filter(q => q.cuenta_id === id).reduce((s, q) => s + Number(q.pagado), 0);
  const estados = { vigente: 'Vigente', pagado: 'Paz y salvo', anulado: 'Anulado', refinanciado: 'Refinanciado' };
  const hojas = {
    'Clientes': per.map(p => ({ 'Cédula': p.cedula, 'Nombre': p.nombre, 'Teléfono': p.telefono, 'Dirección': p.direccion || '', 'Barrio': p.barrio || '', 'Notas': p.notas || '', 'Estado': p.activo ? 'Activo' : 'Anulado' })),
    'Préstamos': cu.map(c => ({ 'Referencia': pad(c.consecutivo), 'Tipo': c.tipo === 'fiado' ? 'Crédito' : 'Préstamo', 'Producto': c.descripcion || '', 'Cliente': (porPer[c.persona_id] || {}).nombre || '', 'Cédula': (porPer[c.persona_id] || {}).cedula || '',
      'Valor': Number(c.capital), 'Tasa mensual %': Number(c.tasa_mensual), 'Frecuencia': c.frecuencia, 'Cuotas': c.num_cuotas, 'Desembolso': c.fecha_desembolso, 'Interés': Number(c.interes_total), 'Total': Number(c.total),
      'Descuento': Number(c.descuento || 0), 'Pagado': pagadoDe(c.id), 'Estado': estados[c.estado] || c.estado })),
    'Cuotas': qs.map(q => ({ 'Referencia': pad((porCu[q.cuenta_id] || {}).consecutivo || 0), 'Cuota': q.numero, 'Vence': q.fecha_vencimiento, 'Valor': Number(q.valor), 'Abono al préstamo': Number(q.capital_parte), 'Interés': Number(q.interes_parte), 'Pagado': Number(q.pagado) })),
    'Pagos': pg.map(p => ({ 'Recibo': pad(p.consecutivo), 'Referencia': pad((porCu[p.cuenta_id] || {}).consecutivo || 0), 'Fecha': p.fecha, 'Valor': Number(p.monto), 'Forma de pago': p.metodo, 'Nota': p.nota || '', 'Estado': p.estado === 'activo' ? 'Activo' : 'Anulado' }))
  };
  const wb = XLSX.utils.book_new();
  Object.entries(hojas).forEach(([n, f]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(f), n));
  const nom = (negocio.nombre || 'negocio').replace(/[^\wÁÉÍÓÚáéíóúñÑ ]/g, '').trim().replace(/\s+/g, '_');
  XLSX.writeFile(wb, `${nom}_datos_${hoy()}.xlsx`);
  return { clientes: per.length, prestamos: cu.length, pagos: pg.length };
}
